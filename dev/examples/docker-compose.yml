services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wiki
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
      POSTGRES_USER: wiki
    logging:
      driver: "none"
    restart: unless-stopped
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql/data

  wiki:
    image: ${WIKI_IMAGE:-ghcr.io/philosophimoonbeam/wiki:0.1.0-alpha.1}
    depends_on:
      - db
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wiki
      DB_PASS_FILE: /run/secrets/db-password
      DB_NAME: wiki
    restart: unless-stopped
    secrets:
      - db-password
    ports:
      - "80:3000"


volumes:
  db-data:

secrets:
  db-password:
    file: ${WIKI_DB_PASSWORD_FILE:?Set WIKI_DB_PASSWORD_FILE to a root-readable password file}
