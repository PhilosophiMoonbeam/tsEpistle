apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "wiki.fullname" . }}-test-connection"
  labels:
    {{- include "wiki.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: health
      image: {{ include "wiki.image" . | quote }}
      imagePullPolicy: {{ default "IfNotPresent" .Values.image.imagePullPolicy }}
      command: ['curl']
      args: ['--fail', '--silent', '--show-error', 'http://{{ include "wiki.fullname" . }}:{{ .Values.service.port }}/healthz']
  restartPolicy: Never
