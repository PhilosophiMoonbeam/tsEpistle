name: Build DigitalOcean Image
run-name: "Marketplace ${{ github.sha }} | ${{ inputs.version }} | ${{ inputs.apt_snapshot }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App Version'
        required: true
        type: string
      apt_snapshot:
        description: 'Immutable Ubuntu archive timestamp (YYYYMMDDTHHMMSSZ)'
        required: true
        type: string

permissions:
  contents: read

env:
  BUN_OPTIONS: --no-env-file

jobs:
  marketplace-controller:
    name: Request Private DigitalOcean Image Build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: trusted-ci-controller
    steps:
    # Only the immutable main implementation executes with the controller credential.
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
      with:
        bun-version: 1.4.4
    - name: Dispatch Once and Await Exact Private Marketplace Run
      env:
        GH_TOKEN: ${{ secrets.CI_CONTROLLER_TOKEN }}
        RELAY_MODE: marketplace
        APPLICATION_VERSION: ${{ inputs.version }}
        APT_SNAPSHOT: ${{ inputs.apt_snapshot }}
      run: bun --no-env-file .github/scripts/controller-relay.mjs
