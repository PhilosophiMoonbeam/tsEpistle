name: Build + Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  PNPM_VERSION: 11.12.0
  WIKI_UPGRADE_SOURCE_IMAGE: ghcr.io/requarks/wiki:2.5.314@sha256:68f0d1848261ae76492ba358e30a96a76fed5d97a3fff381656082bf90f70d7e

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      with:
        version: ${{ env.PNPM_VERSION }}

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Generate Production License Inventory
      run: pnpm run licenses:inventory

    - name: Upload License Inventory
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: compliance
        path: third-party-licenses.json
        if-no-files-found: error
        retention-days: 30

    - name: Lint
      run: pnpm run lint

    - name: Typecheck Shared Contracts
      run: pnpm run typecheck:shared

    - name: Typecheck Client
      run: pnpm run typecheck:client

    - name: Typecheck Server
      run: pnpm run typecheck:server

    - name: Validate Versioned OpenAPI Contract
      run: pnpm run openapi:check

    - name: Run Vitest
      run: pnpm run test

    - name: Build Vite Assets
      run: pnpm run build

  build:
    name: Build Test Image and Linux Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [quality]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set Build Metadata
      shell: bash
      run: node server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Build Test Image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build/Dockerfile
        build-args: |
          WIKI_BUILD_DATE=${{ env.WIKI_BUILD_DATE }}
          WIKI_BUILD_REVISION=${{ env.WIKI_BUILD_REVISION }}
          WIKI_PRODUCT_DESCRIPTION=${{ env.WIKI_PRODUCT_DESCRIPTION }}
          WIKI_PRODUCT_NAME=${{ env.WIKI_PRODUCT_NAME }}
          WIKI_PRODUCT_VERSION=${{ env.WIKI_PRODUCT_VERSION }}
          WIKI_SOURCE_REPOSITORY=${{ env.WIKI_SOURCE_REPOSITORY }}
          WIKI_UPSTREAM_BASE=${{ env.WIKI_UPSTREAM_BASE }}
        load: true
        provenance: false
        sbom: false
        tags: wiki-ts-preview:test-${{ env.WIKI_BUILD_REVISION }}

    - name: Export Test Image
      run: docker save "wiki-ts-preview:test-$WIKI_BUILD_REVISION" | gzip -1 -n > wiki-ts-preview-test-image.tar.gz

    - name: Create Reproducible Linux Bundle
      run: dev/build/create-linux-bundle.sh "wiki-ts-preview:test-$WIKI_BUILD_REVISION" wiki-ts-preview-linux.tar.gz

    - name: Upload Linux Build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: drop
        path: wiki-ts-preview-linux.tar.gz
        if-no-files-found: error

    - name: Upload Test Image
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: test-image
        path: wiki-ts-preview-test-image.tar.gz
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

  reproducibility:
    name: Rebuild Linux Bundle Reproducibly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Download Reference Linux Bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: drop
        path: reference

    - name: Set Build Metadata
      shell: bash
      run: node server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Independently Rebuild Test Image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build/Dockerfile
        build-args: |
          WIKI_BUILD_DATE=${{ env.WIKI_BUILD_DATE }}
          WIKI_BUILD_REVISION=${{ env.WIKI_BUILD_REVISION }}
          WIKI_PRODUCT_DESCRIPTION=${{ env.WIKI_PRODUCT_DESCRIPTION }}
          WIKI_PRODUCT_NAME=${{ env.WIKI_PRODUCT_NAME }}
          WIKI_PRODUCT_VERSION=${{ env.WIKI_PRODUCT_VERSION }}
          WIKI_SOURCE_REPOSITORY=${{ env.WIKI_SOURCE_REPOSITORY }}
          WIKI_UPSTREAM_BASE=${{ env.WIKI_UPSTREAM_BASE }}
        load: true
        provenance: false
        sbom: false
        tags: wiki-ts-preview:reproducibility-${{ env.WIKI_BUILD_REVISION }}

    - name: Compare Independent Linux Bundle
      shell: bash
      run: |
        dev/build/create-linux-bundle.sh \
          "wiki-ts-preview:reproducibility-$WIKI_BUILD_REVISION" \
          wiki-ts-preview-linux.tar.gz
        if ! cmp --silent reference/wiki-ts-preview-linux.tar.gz wiki-ts-preview-linux.tar.gz; then
          sha256sum reference/wiki-ts-preview-linux.tar.gz wiki-ts-preview-linux.tar.gz
          echo 'Independent Linux bundle does not reproduce the release candidate.' >&2
          exit 1
        fi
        sha256sum wiki-ts-preview-linux.tar.gz

  e2e:
    name: Playwright (PostgreSQL ${{ matrix.pgversion }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - pgversion: 15
          postgresImage: postgres:15-alpine@sha256:4006528dcbdd9be8c1aaa50389caea4e93c46d6f54c3533bcd3253725e526e23
        - pgversion: 16
          postgresImage: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        - pgversion: 17
          postgresImage: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
        - pgversion: 18
          postgresImage: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      with:
        version: ${{ env.PNPM_VERSION }}

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install Test Dependencies
      run: |
        pnpm install --frozen-lockfile
        pnpm exec playwright install --with-deps chromium

    - name: Download Test Image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-image
        path: test-image

    - name: Load Test Image
      run: gzip -dc test-image/wiki-ts-preview-test-image.tar.gz | docker load

    - name: Set Test Metadata
      shell: bash
      run: node server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Run Playwright Tests
      env:
        POSTGRES_TEST_IMAGE: ${{ matrix.postgresImage }}
        WIKI_TEST_IMAGE: wiki-ts-preview:test-${{ env.WIKI_BUILD_REVISION }}
        PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      run: |
        chmod u+x dev/e2e/ci-setup.sh
        dev/e2e/ci-setup.sh
        pnpm exec playwright test

  upgrade:
    name: Upgrade Wiki.js 2 (PostgreSQL ${{ matrix.pgversion }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - pgversion: 15
          postgresImage: postgres:15-alpine@sha256:4006528dcbdd9be8c1aaa50389caea4e93c46d6f54c3533bcd3253725e526e23
        - pgversion: 16
          postgresImage: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        - pgversion: 17
          postgresImage: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
        - pgversion: 18
          postgresImage: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Download Test Image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-image
        path: test-image

    - name: Load Test Image
      run: gzip -dc test-image/wiki-ts-preview-test-image.tar.gz | docker load

    - name: Set Test Metadata
      shell: bash
      run: node server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Upgrade Supported Database
      env:
        POSTGRES_TEST_IMAGE: ${{ matrix.postgresImage }}
        WIKI_TEST_IMAGE: wiki-ts-preview:test-${{ env.WIKI_BUILD_REVISION }}
        MIGRATION_METRICS_FILE: migration-metrics-postgres-${{ matrix.pgversion }}.json
      run: dev/e2e/upgrade-smoke.sh

    - name: Upload Migration Metrics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: migration-metrics-postgres-${{ matrix.pgversion }}
        path: migration-metrics-postgres-${{ matrix.pgversion }}.json
        if-no-files-found: warn
        retention-days: 30

  multi-instance:
    name: Multi-instance Recovery (PostgreSQL ${{ matrix.pgversion }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - pgversion: 15
          postgresImage: postgres:15-alpine@sha256:4006528dcbdd9be8c1aaa50389caea4e93c46d6f54c3533bcd3253725e526e23
        - pgversion: 18
          postgresImage: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44


    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Download Test Image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-image
        path: test-image

    - name: Load Test Image
      run: gzip -dc test-image/wiki-ts-preview-test-image.tar.gz | docker load

    - name: Set Test Metadata
      shell: bash
      run: node server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Exercise Instance Loss and Recovery
      env:
        POSTGRES_TEST_IMAGE: ${{ matrix.postgresImage }}
        WIKI_TEST_IMAGE: wiki-ts-preview:test-${{ env.WIKI_BUILD_REVISION }}
      run: dev/e2e/multi-instance-smoke.sh

  helm-lifecycle:
    name: Helm Install Upgrade Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Download Test Image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-image
        path: test-image

    - name: Load Test Image
      run: gzip -dc test-image/wiki-ts-preview-test-image.tar.gz | docker load

    - name: Set Test Metadata
      shell: bash
      run: node server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Install Pinned Kubernetes Tools
      shell: bash
      run: |
        curl --fail --silent --show-error --location --output /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
        echo '50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind' | sha256sum --check
        sudo install -m 0755 /tmp/kind /usr/local/bin/kind
        curl --fail --silent --show-error --location --output /tmp/helm.tar.gz https://get.helm.sh/helm-v4.0.4-linux-amd64.tar.gz
        echo '29454bc351f4433e66c00f5d37841627cbbcc02e4c70a6d796529d355237671c  /tmp/helm.tar.gz' | sha256sum --check
        tar -xzf /tmp/helm.tar.gz -C /tmp
        sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
        curl --fail --silent --show-error --location --output /tmp/kubectl https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
        echo '629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7  /tmp/kubectl' | sha256sum --check
        sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

    - name: Create Lifecycle Cluster
      run: |
        kind create cluster --name wiki-lifecycle --image kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
        docker pull postgres@sha256:a2c20749c564b4eb73a77bfda626f8a3cde1bbfae020fb97c616a00cdc1a2181
        docker tag postgres@sha256:a2c20749c564b4eb73a77bfda626f8a3cde1bbfae020fb97c616a00cdc1a2181 wiki-postgres-test:15
        kind load docker-image --name wiki-lifecycle \
          "wiki-ts-preview:test-${WIKI_BUILD_REVISION}" \
          wiki-postgres-test:15

    - name: Exercise Helm Lifecycle
      env:
        WIKI_TEST_IMAGE_REPOSITORY: wiki-ts-preview
        WIKI_TEST_IMAGE_TAG: test-${{ env.WIKI_BUILD_REVISION }}
        POSTGRES_TEST_IMAGE_REPOSITORY: wiki-postgres-test
        POSTGRES_TEST_IMAGE_TAG: '15'
      run: dev/e2e/helm-lifecycle-smoke.sh

    - name: Delete Lifecycle Cluster
      if: always()
      run: kind delete cluster --name wiki-lifecycle


  publish-amd64:
    name: Publish AMD64 Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [e2e, upgrade, multi-instance, helm-lifecycle]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set Build Metadata
      shell: bash
      run: node server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Validate Release Tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: test "$GITHUB_REF_NAME" = "v$WIKI_PRODUCT_VERSION"

    - name: Verify Published Source Revision
      run: curl --fail --silent --show-error --location --output /dev/null "$WIKI_SOURCE_REPOSITORY/tree/$WIKI_BUILD_REVISION"


    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4


    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push AMD64 Images
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build/Dockerfile
        build-args: |
          WIKI_BUILD_DATE=${{ env.WIKI_BUILD_DATE }}
          WIKI_BUILD_REVISION=${{ env.WIKI_BUILD_REVISION }}
          WIKI_PRODUCT_DESCRIPTION=${{ env.WIKI_PRODUCT_DESCRIPTION }}
          WIKI_PRODUCT_NAME=${{ env.WIKI_PRODUCT_NAME }}
          WIKI_PRODUCT_VERSION=${{ env.WIKI_PRODUCT_VERSION }}
          WIKI_SOURCE_REPOSITORY=${{ env.WIKI_SOURCE_REPOSITORY }}
          WIKI_UPSTREAM_BASE=${{ env.WIKI_UPSTREAM_BASE }}
        platforms: linux/amd64
        provenance: mode=max
        sbom: true
        push: true
        tags: |
          ${{ env.IMAGE_REPOSITORY }}:canary
          ${{ env.IMAGE_REPOSITORY }}:canary-${{ env.REL_VERSION_STRICT }}

  arm:
    name: ARM Build
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'push'
    needs: [e2e]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set Build Metadata
      shell: bash
      run: node server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Validate Release Tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: test "$GITHUB_REF_NAME" = "v$WIKI_PRODUCT_VERSION"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4


    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download Linux Build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: drop
        path: drop

    - name: Extract Build
      run: |
        mkdir -p build
        tar -xzf "$GITHUB_WORKSPACE/drop/wiki-ts-preview-linux.tar.gz" -C "$GITHUB_WORKSPACE/build" --exclude=node_modules

    - name: Build and Push ARM64 Images
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build-arm/Dockerfile
        build-args: |
          WIKI_BUILD_DATE=${{ env.WIKI_BUILD_DATE }}
          WIKI_BUILD_REVISION=${{ env.WIKI_BUILD_REVISION }}
          WIKI_PRODUCT_DESCRIPTION=${{ env.WIKI_PRODUCT_DESCRIPTION }}
          WIKI_PRODUCT_NAME=${{ env.WIKI_PRODUCT_NAME }}
          WIKI_PRODUCT_VERSION=${{ env.WIKI_PRODUCT_VERSION }}
          WIKI_SOURCE_REPOSITORY=${{ env.WIKI_SOURCE_REPOSITORY }}
          WIKI_UPSTREAM_BASE=${{ env.WIKI_UPSTREAM_BASE }}
        platforms: linux/arm64
        provenance: mode=max
        sbom: true
        push: true
        tags: |
          ${{ env.IMAGE_REPOSITORY }}:canary-arm64-${{ env.REL_VERSION_STRICT }}

  windows:
    name: Windows Build
    runs-on: windows-latest
    if: github.event_name == 'push'
    needs: [e2e]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Node.js Environment
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc

    - name: Download Linux Build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: drop
        path: drop

    - name: Extract Build
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path win -Force
        tar -xzf "$env:GITHUB_WORKSPACE\drop\wiki-ts-preview-linux.tar.gz" -C "$env:GITHUB_WORKSPACE\win"
        Remove-Item -Path win\node_modules -Force -Recurse
        Copy-Item pnpm-lock.yaml, pnpm-workspace.yaml, .npmrc -Destination win -Force
        Copy-Item patches -Destination win\patches -Recurse -Force

    - name: Install Production Dependencies
      shell: pwsh
      working-directory: win
      run: |
        corepack enable
        pnpm install --prod --frozen-lockfile


    - name: Remove Dependency Metadata
      shell: pwsh
      run: |
        Remove-Item win\pnpm-lock.yaml, win\pnpm-workspace.yaml, win\.npmrc -Force
        Remove-Item win\patches -Recurse -Force

    - name: Create Bundle
      shell: pwsh
      run: tar -czf "$env:GITHUB_WORKSPACE\wiki-ts-preview-windows.tar.gz" -C "$env:GITHUB_WORKSPACE\win" .

    - name: Upload Windows Build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: drop-win
        path: wiki-ts-preview-windows.tar.gz
        if-no-files-found: error

  beta:
    name: Publish Preview Images
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-amd64, arm, windows]
    permissions:
      packages: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set Build Metadata
      run: node server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4


    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create and Push Preview Manifest
      shell: bash
      run: |
        docker buildx imagetools create \
          --tag "$IMAGE_REPOSITORY:preview-$REL_VERSION_STRICT" \
          "$IMAGE_REPOSITORY:canary-$REL_VERSION_STRICT" \
          "$IMAGE_REPOSITORY:canary-arm64-$REL_VERSION_STRICT"

  release:
    name: Publish Release Images
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: prod
    needs: [beta, reproducibility]
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set Build Metadata
      shell: bash
      run: node server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Validate Release Tag
      run: test "$GITHUB_REF_NAME" = "v$WIKI_PRODUCT_VERSION"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4


    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create and Push Release Manifest
      shell: bash
      run: |
        docker buildx imagetools create \
          --metadata-file release-image-metadata.json \
          --tag "$IMAGE_REPOSITORY:$REL_VERSION_STRICT" \
          --tag "$IMAGE_REPOSITORY:preview" \
          "$IMAGE_REPOSITORY:canary-$REL_VERSION_STRICT" \
          "$IMAGE_REPOSITORY:canary-arm64-$REL_VERSION_STRICT"
        image_digest="$(jq --exit-status --raw-output '."containerimage.descriptor".digest' release-image-metadata.json)"
        [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        echo "IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"

    - name: Download Linux Build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: drop
        path: drop

    - name: Download Windows Build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: drop-win
        path: drop-win

    - name: Download License Inventory
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: compliance
        path: compliance

    - name: Generate Release Image SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        image: ${{ env.IMAGE_REPOSITORY }}:${{ env.REL_VERSION_STRICT }}
        format: spdx-json
        output-file: wiki-ts-preview.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Package Helm Chart
      shell: bash
      run: |
        test "$WIKI_PRODUCT_VERSION" = "$(helm show chart dev/helm | sed -n 's/^appVersion: *//p')"
        helm lint dev/helm --set postgresql.postgresqlPassword=ci-validation-only
        helm package --destination dist dev/helm

    - name: Stage Release Artifacts
      shell: bash
      run: |
        cp drop/wiki-ts-preview-linux.tar.gz .
        cp drop-win/wiki-ts-preview-windows.tar.gz .
        cp "dist/wiki-ts-preview-$REL_VERSION_STRICT.tgz" .
        cp compliance/third-party-licenses.json .

    - name: Create Corresponding Source Archive
      run: git archive --format=tar.gz --prefix="wiki-ts-preview-$REL_VERSION_STRICT/" --output=wiki-ts-preview-source.tar.gz "$WIKI_BUILD_REVISION"

    - name: Generate Release Manifest and Checksums
      run: |
        node server/scripts/generate-release-manifest.ts \
          release-manifest.json \
          SHA256SUMS \
          wiki-ts-preview-linux.tar.gz \
          wiki-ts-preview-windows.tar.gz \
          wiki-ts-preview-source.tar.gz \
          "wiki-ts-preview-$REL_VERSION_STRICT.tgz" \
          wiki-ts-preview.spdx.json \
          third-party-licenses.json
        sha256sum --check SHA256SUMS

    - name: Attest Release Artifacts
      id: attest-release
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-checksums: SHA256SUMS

    - name: Stage Offline Provenance Bundle
      run: cp "${{ steps.attest-release.outputs.bundle-path }}" wiki-ts-preview-release.intoto.jsonl

    - name: Attest Release Image Provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-name: ${{ env.IMAGE_REPOSITORY }}
        subject-digest: ${{ env.IMAGE_DIGEST }}
        push-to-registry: true

    - name: Attest Release Image SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-name: ${{ env.IMAGE_REPOSITORY }}
        subject-digest: ${{ env.IMAGE_DIGEST }}
        sbom-path: wiki-ts-preview.spdx.json
        push-to-registry: true

    - name: Generate Changelog
      id: changelog
      uses: Requarks/changelog-action@b78a3354a01f4a1affb484b9264b506a815c46b1 # v1
      with:
        token: ${{ github.token }}
        tag: ${{ github.ref_name }}
        writeToFile: false

    - name: Update GitHub Release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        allowUpdates: true
        draft: false
        makeLatest: true
        name: ${{ github.ref_name }}
        body: ${{ steps.changelog.outputs.changes }}
        token: ${{ github.token }}
        artifacts: 'wiki-ts-preview-linux.tar.gz,wiki-ts-preview-windows.tar.gz,wiki-ts-preview-source.tar.gz,wiki-ts-preview-*.tgz,wiki-ts-preview.spdx.json,third-party-licenses.json,release-manifest.json,SHA256SUMS,wiki-ts-preview-release.intoto.jsonl'

    - name: Notify Telegram Channel
      uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        format: markdown
        disable_web_page_preview: true
        message: |
          Wiki.ts Preview *${{ github.ref_name }}* has been released!
          See [release notes](https://github.com/PhilosophiMoonbeam/wiki/releases) for details.

    - name: Notify Discord Channel
      uses: sebastianpopp/discord-action@4f2d5417bc61a79593304a62e71cd32427c17790 # v2.0
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        message: Wiki.ts Preview ${{ github.ref_name }} has been released! See https://github.com/PhilosophiMoonbeam/wiki/releases for details.
