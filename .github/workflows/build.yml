name: Local CI + Publish

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  WIKI_UPGRADE_SOURCE_IMAGE: ghcr.io/requarks/wiki:2.5.314@sha256:68f0d1848261ae76492ba358e30a96a76fed5d97a3fff381656082bf90f70d7e

jobs:
  quality:
    name: Quality
    runs-on: [self-hosted, linux, x64, tsfranki-ci]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Verify Local Toolchain
      run: |
        test "$(bun --version)" = "$BUN_VERSION"
        docker version

    - name: Install Dependencies
      run: bun install --frozen-lockfile

    - name: Validate Dependency and License Policy
      run: |
        bun run dependencies:check
        bun run licenses:check

    - name: Upload License Inventory
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: compliance
        path: third-party-licenses.json
        if-no-files-found: error
        retention-days: 30

    - name: Lint
      run: bun run lint

    - name: Typecheck Shared Contracts
      run: bun run typecheck:shared

    - name: Typecheck Client
      run: bun run typecheck:client

    - name: Typecheck Server
      run: bun run typecheck:server

    - name: Validate Versioned OpenAPI Contract
      run: bun run openapi:check
    - name: Reject Production Placeholders
      run: bun run placeholders:check
    - name: Validate Frozen Agent Release Inputs
      run: bun run agents:release-check


    - name: Run Bun Tests
      run: bun run test

    - name: Build Vite Assets
      run: bun run build


  agent-postgres:
    name: Agent Ledger (PostgreSQL ${{ matrix.pgversion }})
    runs-on: [self-hosted, linux, x64, tsfranki-ci]
    timeout-minutes: 15
    needs: [quality]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - pgversion: 16
          postgresImage: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        - pgversion: 17
          postgresImage: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
    services:
      postgres:
        image: ${{ matrix.postgresImage }}
        env:
          POSTGRES_DB: wiki_agents_test
          POSTGRES_PASSWORD: test
          POSTGRES_USER: wiki
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U wiki -d wiki_agents_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - run: bun install --frozen-lockfile
    - name: Exercise Agent Migration and Rollback
      env:
        WIKI_TEST_POSTGRES_DATABASE: wiki_agents_test
        WIKI_TEST_POSTGRES_HOST: 127.0.0.1
        WIKI_TEST_POSTGRES_PASSWORD: test
        WIKI_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        WIKI_TEST_POSTGRES_USER: wiki
      run: bun test server/test/db/agents-migration.postgres.integration.test.ts

  agent-browser-image:
    name: Agent Browser Multi-arch Image
    runs-on: [self-hosted, linux, x64, tsfranki-ci]
    timeout-minutes: 20
    needs: [quality]
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      with:
        image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm64
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
    - name: Build AMD64 and ARM64 Browser Worker
      run: |
        docker buildx build \
          --file dev/build/Dockerfile.agent-browser \
          --platform linux/amd64,linux/arm64 \
          --output type=oci,dest=/tmp/wiki-agent-browser.oci.tar \
          .
        test -s /tmp/wiki-agent-browser.oci.tar
  page-index-benchmark:
    name: Page Index Benchmark (PostgreSQL ${{ matrix.pgversion }})
    runs-on: [self-hosted, linux, x64, tsfranki-ci]
    timeout-minutes: 15
    needs: [quality]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - pgversion: 15
          postgresImage: postgres:15-alpine@sha256:4006528dcbdd9be8c1aaa50389caea4e93c46d6f54c3533bcd3253725e526e23
        - pgversion: 16
          postgresImage: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        - pgversion: 17
          postgresImage: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
        - pgversion: 18
          postgresImage: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Install Dependencies
      run: bun install --frozen-lockfile
    - name: Measure Bounded Page Index
      env:
        POSTGRES_TEST_IMAGE: ${{ matrix.postgresImage }}
        PAGE_INDEX_BENCHMARK_FILE: page-index-benchmark-postgres-${{ matrix.pgversion }}.json
      run: bun run benchmark:page-index
    - name: Upload Page Index Metrics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: page-index-benchmark-postgres-${{ matrix.pgversion }}
        path: page-index-benchmark-postgres-${{ matrix.pgversion }}.json
        if-no-files-found: error
        retention-days: 30

  build:
    name: Build Test Image and Linux Bundle
    runs-on: [self-hosted, linux, x64, tsfranki-ci]
    timeout-minutes: 45
    needs: [quality]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set Build Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Build Test Image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build/Dockerfile
        build-args: |
          WIKI_BUILD_DATE=${{ env.WIKI_BUILD_DATE }}
          WIKI_BUILD_REVISION=${{ env.WIKI_BUILD_REVISION }}
          WIKI_PRODUCT_DESCRIPTION=${{ env.WIKI_PRODUCT_DESCRIPTION }}
          WIKI_PRODUCT_NAME=${{ env.WIKI_PRODUCT_NAME }}
          WIKI_PRODUCT_VERSION=${{ env.WIKI_PRODUCT_VERSION }}
          WIKI_SOURCE_REPOSITORY=${{ env.WIKI_SOURCE_REPOSITORY }}
          WIKI_UPSTREAM_BASE=${{ env.WIKI_UPSTREAM_BASE }}
        load: true
        provenance: false
        sbom: false
        tags: tsfranki:test-${{ env.WIKI_BUILD_REVISION }}

    - name: Export Test Image
      run: docker save "tsfranki:test-$WIKI_BUILD_REVISION" | gzip -1 -n > tsfranki-test-image.tar.gz

    - name: Create Reproducible Linux Bundle
      run: dev/build/create-linux-bundle.sh "tsfranki:test-$WIKI_BUILD_REVISION" tsfranki-linux.tar.gz

    - name: Upload Linux Build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: drop
        path: tsfranki-linux.tar.gz
        if-no-files-found: error

    - name: Upload Test Image
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: test-image
        path: tsfranki-test-image.tar.gz
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

  reproducibility:
    name: Rebuild Linux Bundle Reproducibly
    runs-on: [self-hosted, linux, x64, tsfranki-ci]
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Download Reference Linux Bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: drop
        path: reference

    - name: Set Build Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Independently Rebuild Test Image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build/Dockerfile
        build-args: |
          WIKI_BUILD_DATE=${{ env.WIKI_BUILD_DATE }}
          WIKI_BUILD_REVISION=${{ env.WIKI_BUILD_REVISION }}
          WIKI_PRODUCT_DESCRIPTION=${{ env.WIKI_PRODUCT_DESCRIPTION }}
          WIKI_PRODUCT_NAME=${{ env.WIKI_PRODUCT_NAME }}
          WIKI_PRODUCT_VERSION=${{ env.WIKI_PRODUCT_VERSION }}
          WIKI_SOURCE_REPOSITORY=${{ env.WIKI_SOURCE_REPOSITORY }}
          WIKI_UPSTREAM_BASE=${{ env.WIKI_UPSTREAM_BASE }}
        load: true
        provenance: false
        sbom: false
        tags: tsfranki:reproducibility-${{ env.WIKI_BUILD_REVISION }}

    - name: Compare Independent Linux Bundle
      shell: bash
      run: |
        dev/build/create-linux-bundle.sh \
          "tsfranki:reproducibility-$WIKI_BUILD_REVISION" \
          tsfranki-linux.tar.gz
        if ! cmp --silent reference/tsfranki-linux.tar.gz tsfranki-linux.tar.gz; then
          sha256sum reference/tsfranki-linux.tar.gz tsfranki-linux.tar.gz
          echo 'Independent Linux bundle does not reproduce the release candidate.' >&2
          exit 1
        fi
        sha256sum tsfranki-linux.tar.gz

  e2e:
    name: Playwright (PostgreSQL ${{ matrix.pgversion }})
    runs-on: [self-hosted, linux, x64, tsfranki-ci]
    timeout-minutes: 45
    needs: [build]
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - pgversion: 15
          postgresImage: postgres:15-alpine@sha256:4006528dcbdd9be8c1aaa50389caea4e93c46d6f54c3533bcd3253725e526e23
        - pgversion: 16
          postgresImage: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        - pgversion: 17
          postgresImage: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
        - pgversion: 18
          postgresImage: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Install Test Dependencies
      run: |
        bun install --frozen-lockfile
        bun --bun playwright install --with-deps chromium
        if [ "${{ matrix.pgversion }}" = "18" ]; then
          bun --bun playwright install --with-deps firefox webkit
        fi

    - name: Download Test Image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-image
        path: test-image

    - name: Load Test Image
      run: gzip -dc test-image/tsfranki-test-image.tar.gz | docker load

    - name: Set Test Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Run Playwright Tests
      env:
        POSTGRES_TEST_IMAGE: ${{ matrix.postgresImage }}
        WIKI_TEST_IMAGE: tsfranki:test-${{ env.WIKI_BUILD_REVISION }}
        PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        RUNTIME_PERFORMANCE_FILE: runtime-performance-postgres-${{ matrix.pgversion }}.json
      run: |
        chmod u+x dev/e2e/ci-setup.sh
        dev/e2e/ci-setup.sh
        bun --bun playwright test \
          --project=chromium \
          --project=accessibility-keyboard \
          --project=accessibility-dark \
          --project=accessibility-mobile \
          --project=accessibility-tablet \
          --project=accessibility-wide \
          --project=performance-desktop
        if [ "${{ matrix.pgversion }}" = "18" ]; then
          bun run e2e:responsive --no-deps
        fi

    - name: Upload Playwright Failure Artifacts
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: playwright-failures-postgres-${{ matrix.pgversion }}
        path: test-results
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload Runtime Performance Metrics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: runtime-performance-postgres-${{ matrix.pgversion }}
        path: runtime-performance-postgres-${{ matrix.pgversion }}.json
        if-no-files-found: error
        retention-days: 30

  upgrade:
    name: Upgrade Wiki.js 2 (PostgreSQL ${{ matrix.pgversion }})
    runs-on: [self-hosted, linux, x64, tsfranki-ci]
    timeout-minutes: 30
    needs: [build]
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - pgversion: 15
          postgresImage: postgres:15-alpine@sha256:4006528dcbdd9be8c1aaa50389caea4e93c46d6f54c3533bcd3253725e526e23
        - pgversion: 16
          postgresImage: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        - pgversion: 17
          postgresImage: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
        - pgversion: 18
          postgresImage: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Download Test Image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-image
        path: test-image

    - name: Load Test Image
      run: gzip -dc test-image/tsfranki-test-image.tar.gz | docker load

    - name: Set Test Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Upgrade Supported Database
      env:
        POSTGRES_TEST_IMAGE: ${{ matrix.postgresImage }}
        WIKI_TEST_IMAGE: tsfranki:test-${{ env.WIKI_BUILD_REVISION }}
        MIGRATION_METRICS_FILE: migration-metrics-postgres-${{ matrix.pgversion }}.json
      run: dev/e2e/upgrade-smoke.sh

    - name: Upload Migration Metrics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: migration-metrics-postgres-${{ matrix.pgversion }}
        path: migration-metrics-postgres-${{ matrix.pgversion }}.json
        if-no-files-found: warn
        retention-days: 30

  multi-instance:
    name: Multi-instance Recovery (PostgreSQL ${{ matrix.pgversion }})
    runs-on: [self-hosted, linux, x64, tsfranki-ci]
    timeout-minutes: 20
    needs: [build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - pgversion: 15
          postgresImage: postgres:15-alpine@sha256:4006528dcbdd9be8c1aaa50389caea4e93c46d6f54c3533bcd3253725e526e23
        - pgversion: 18
          postgresImage: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44


    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Download Test Image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-image
        path: test-image

    - name: Load Test Image
      run: gzip -dc test-image/tsfranki-test-image.tar.gz | docker load

    - name: Set Test Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Exercise Instance Loss and Recovery
      env:
        POSTGRES_TEST_IMAGE: ${{ matrix.postgresImage }}
        WIKI_TEST_IMAGE: tsfranki:test-${{ env.WIKI_BUILD_REVISION }}
      run: dev/e2e/multi-instance-smoke.sh

  helm-lifecycle:
    name: Helm Install Upgrade Rollback
    runs-on: [self-hosted, linux, x64, tsfranki-ci]
    timeout-minutes: 25
    needs: [build]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Download Test Image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-image
        path: test-image

    - name: Load Test Image
      run: gzip -dc test-image/tsfranki-test-image.tar.gz | docker load

    - name: Set Test Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Install Pinned Kubernetes Tools
      shell: bash
      run: |
        curl --fail --silent --show-error --location --output /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
        echo '50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind' | sha256sum --check
        sudo install -m 0755 /tmp/kind /usr/local/bin/kind
        curl --fail --silent --show-error --location --output /tmp/helm.tar.gz https://get.helm.sh/helm-v4.0.4-linux-amd64.tar.gz
        echo '29454bc351f4433e66c00f5d37841627cbbcc02e4c70a6d796529d355237671c  /tmp/helm.tar.gz' | sha256sum --check
        tar -xzf /tmp/helm.tar.gz -C /tmp
        sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
        curl --fail --silent --show-error --location --output /tmp/kubectl https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
        echo '629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7  /tmp/kubectl' | sha256sum --check
        sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

    - name: Create Lifecycle Cluster
      run: |
        kind create cluster --name wiki-lifecycle --image kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
        docker pull postgres@sha256:a2c20749c564b4eb73a77bfda626f8a3cde1bbfae020fb97c616a00cdc1a2181
        docker tag postgres@sha256:a2c20749c564b4eb73a77bfda626f8a3cde1bbfae020fb97c616a00cdc1a2181 wiki-postgres-test:15
        kind load docker-image --name wiki-lifecycle \
          "tsfranki:test-${WIKI_BUILD_REVISION}" \
          wiki-postgres-test:15

    - name: Exercise Helm Lifecycle
      env:
        WIKI_TEST_IMAGE_REPOSITORY: tsfranki
        WIKI_TEST_IMAGE_TAG: test-${{ env.WIKI_BUILD_REVISION }}
        POSTGRES_TEST_IMAGE_REPOSITORY: wiki-postgres-test
        POSTGRES_TEST_IMAGE_TAG: '15'
      run: dev/e2e/helm-lifecycle-smoke.sh

    - name: Delete Lifecycle Cluster
      if: always()
      run: kind delete cluster --name wiki-lifecycle


  publish-amd64:
    name: Publish AMD64 Images
    runs-on: [self-hosted, linux, x64, tsfranki-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [e2e, upgrade, multi-instance, helm-lifecycle, page-index-benchmark, agent-postgres, agent-browser-image]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set Build Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Validate Release Tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: test "$GITHUB_REF_NAME" = "v$WIKI_PRODUCT_VERSION"

    - name: Verify Published Source Revision
      run: curl --fail --silent --show-error --location --output /dev/null "$WIKI_SOURCE_REPOSITORY/tree/$WIKI_BUILD_REVISION"


    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4


    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push AMD64 Images
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build/Dockerfile
        build-args: |
          WIKI_BUILD_DATE=${{ env.WIKI_BUILD_DATE }}
          WIKI_BUILD_REVISION=${{ env.WIKI_BUILD_REVISION }}
          WIKI_PRODUCT_DESCRIPTION=${{ env.WIKI_PRODUCT_DESCRIPTION }}
          WIKI_PRODUCT_NAME=${{ env.WIKI_PRODUCT_NAME }}
          WIKI_PRODUCT_VERSION=${{ env.WIKI_PRODUCT_VERSION }}
          WIKI_SOURCE_REPOSITORY=${{ env.WIKI_SOURCE_REPOSITORY }}
          WIKI_UPSTREAM_BASE=${{ env.WIKI_UPSTREAM_BASE }}
        platforms: linux/amd64
        provenance: mode=max
        sbom: true
        push: true
        tags: |
          ${{ env.IMAGE_REPOSITORY }}:canary
          ${{ env.IMAGE_REPOSITORY }}:canary-${{ env.REL_VERSION_STRICT }}

    - name: Build and Push AMD64 Agent Browser Image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build/Dockerfile.agent-browser
        platforms: linux/amd64
        provenance: mode=max
        sbom: true
        push: true
        tags: |
          ${{ env.IMAGE_REPOSITORY }}-agent-browser:canary
          ${{ env.IMAGE_REPOSITORY }}-agent-browser:canary-${{ env.REL_VERSION_STRICT }}

  arm:
    name: ARM64 Cross-build
    runs-on: [self-hosted, linux, x64, tsfranki-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [e2e, page-index-benchmark, agent-postgres, agent-browser-image]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      with:
        image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm64

    - name: Set Build Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Validate Release Tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: test "$GITHUB_REF_NAME" = "v$WIKI_PRODUCT_VERSION"


    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4


    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download Linux Build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: drop
        path: drop

    - name: Extract Build
      run: |
        mkdir -p build
        tar -xzf "$GITHUB_WORKSPACE/drop/tsfranki-linux.tar.gz" -C "$GITHUB_WORKSPACE/build" --exclude=node_modules

    - name: Build and Push ARM64 Images
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build-arm/Dockerfile
        build-args: |
          WIKI_BUILD_DATE=${{ env.WIKI_BUILD_DATE }}
          WIKI_BUILD_REVISION=${{ env.WIKI_BUILD_REVISION }}
          WIKI_PRODUCT_DESCRIPTION=${{ env.WIKI_PRODUCT_DESCRIPTION }}
          WIKI_PRODUCT_NAME=${{ env.WIKI_PRODUCT_NAME }}
          WIKI_PRODUCT_VERSION=${{ env.WIKI_PRODUCT_VERSION }}
          WIKI_SOURCE_REPOSITORY=${{ env.WIKI_SOURCE_REPOSITORY }}
          WIKI_UPSTREAM_BASE=${{ env.WIKI_UPSTREAM_BASE }}
        platforms: linux/arm64
        provenance: mode=max
        sbom: true
        push: true
        tags: |
          ${{ env.IMAGE_REPOSITORY }}:canary-arm64-${{ env.REL_VERSION_STRICT }}

    - name: Build and Push ARM64 Agent Browser Image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build/Dockerfile.agent-browser
        platforms: linux/arm64
        provenance: mode=max
        sbom: true
        push: true
        tags: |
          ${{ env.IMAGE_REPOSITORY }}-agent-browser:canary-arm64-${{ env.REL_VERSION_STRICT }}

  beta:
    name: Publish Preview Images
    runs-on: [self-hosted, linux, x64, tsfranki-ci]
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-amd64, arm]
    permissions:
      packages: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set Build Metadata
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4


    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create and Push Preview Manifest
      shell: bash
      run: |
        docker buildx imagetools create \
          --tag "$IMAGE_REPOSITORY:preview-$REL_VERSION_STRICT" \
          "$IMAGE_REPOSITORY:canary-$REL_VERSION_STRICT" \
          "$IMAGE_REPOSITORY:canary-arm64-$REL_VERSION_STRICT"
        docker buildx imagetools create \
          --tag "$IMAGE_REPOSITORY-agent-browser:preview-$REL_VERSION_STRICT" \
          "$IMAGE_REPOSITORY-agent-browser:canary-$REL_VERSION_STRICT" \
          "$IMAGE_REPOSITORY-agent-browser:canary-arm64-$REL_VERSION_STRICT"

  release:
    name: Publish Release Images
    runs-on: [self-hosted, linux, x64, tsfranki-ci]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: prod
    needs: [beta, reproducibility]
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set Build Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Validate Release Tag
      run: test "$GITHUB_REF_NAME" = "v$WIKI_PRODUCT_VERSION"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4


    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create and Push Release Manifest
      shell: bash
      run: |
        docker buildx imagetools create \
          --metadata-file release-image-metadata.json \
          --tag "$IMAGE_REPOSITORY:$REL_VERSION_STRICT" \
          --tag "$IMAGE_REPOSITORY:preview" \
          "$IMAGE_REPOSITORY:canary-$REL_VERSION_STRICT" \
          "$IMAGE_REPOSITORY:canary-arm64-$REL_VERSION_STRICT"
        image_digest="$(jq --exit-status --raw-output '."containerimage.descriptor".digest' release-image-metadata.json)"
        [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        echo "IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
        docker buildx imagetools create \
          --metadata-file agent-browser-image-metadata.json \
          --tag "$IMAGE_REPOSITORY-agent-browser:$REL_VERSION_STRICT" \
          --tag "$IMAGE_REPOSITORY-agent-browser:preview" \
          "$IMAGE_REPOSITORY-agent-browser:canary-$REL_VERSION_STRICT" \
          "$IMAGE_REPOSITORY-agent-browser:canary-arm64-$REL_VERSION_STRICT"
        agent_browser_image_digest="$(jq --exit-status --raw-output '."containerimage.descriptor".digest' agent-browser-image-metadata.json)"
        [[ "$agent_browser_image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        echo "AGENT_BROWSER_IMAGE_DIGEST=$agent_browser_image_digest" >> "$GITHUB_ENV"

    - name: Download Linux Build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: drop
        path: drop


    - name: Download License Inventory
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: compliance
        path: compliance

    - name: Generate Release Image SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        image: ${{ env.IMAGE_REPOSITORY }}:${{ env.REL_VERSION_STRICT }}
        format: spdx-json
        output-file: tsfranki.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Generate Agent Browser Image SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        image: ${{ env.IMAGE_REPOSITORY }}-agent-browser:${{ env.REL_VERSION_STRICT }}
        format: spdx-json
        output-file: wiki-agent-browser.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Package Helm Chart
      shell: bash
      run: |
        test "$WIKI_PRODUCT_VERSION" = "$(helm show chart dev/helm | sed -n 's/^appVersion: *//p')"
        helm lint dev/helm --set postgresql.postgresqlPassword=ci-validation-only
        helm package --destination dist dev/helm

    - name: Stage Release Artifacts
      shell: bash
      run: |
        cp drop/tsfranki-linux.tar.gz .
        cp "dist/tsfranki-$REL_VERSION_STRICT.tgz" .
        cp compliance/third-party-licenses.json .

    - name: Create Corresponding Source Archive
      run: git archive --format=tar.gz --prefix="tsfranki-$REL_VERSION_STRICT/" --output=tsfranki-source.tar.gz "$WIKI_BUILD_REVISION"

    - name: Generate Release Manifest and Checksums
      run: |
        bun server/scripts/generate-release-manifest.ts \
          release-manifest.json \
          SHA256SUMS \
          tsfranki-linux.tar.gz \
          tsfranki-source.tar.gz \
          "tsfranki-$REL_VERSION_STRICT.tgz" \
          tsfranki.spdx.json \
          wiki-agent-browser.spdx.json \
          third-party-licenses.json
        sha256sum --check SHA256SUMS

    - name: Attest Release Artifacts
      id: attest-release
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-checksums: SHA256SUMS

    - name: Stage Offline Provenance Bundle
      run: cp "${{ steps.attest-release.outputs.bundle-path }}" tsfranki-release.intoto.jsonl

    - name: Attest Release Image Provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-name: ${{ env.IMAGE_REPOSITORY }}
        subject-digest: ${{ env.IMAGE_DIGEST }}
        push-to-registry: true

    - name: Attest Release Image SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-name: ${{ env.IMAGE_REPOSITORY }}
        subject-digest: ${{ env.IMAGE_DIGEST }}
        sbom-path: tsfranki.spdx.json
        push-to-registry: true

    - name: Attest Agent Browser Image Provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-name: ${{ env.IMAGE_REPOSITORY }}-agent-browser
        subject-digest: ${{ env.AGENT_BROWSER_IMAGE_DIGEST }}
        push-to-registry: true

    - name: Attest Agent Browser Image SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-name: ${{ env.IMAGE_REPOSITORY }}-agent-browser
        subject-digest: ${{ env.AGENT_BROWSER_IMAGE_DIGEST }}
        sbom-path: wiki-agent-browser.spdx.json
        push-to-registry: true

    - name: Generate Changelog
      id: changelog
      uses: Requarks/changelog-action@b78a3354a01f4a1affb484b9264b506a815c46b1 # v1
      with:
        token: ${{ github.token }}
        tag: ${{ github.ref_name }}
        writeToFile: false

    - name: Update GitHub Release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        allowUpdates: true
        draft: false
        makeLatest: true
        name: ${{ github.ref_name }}
        body: ${{ steps.changelog.outputs.changes }}
        token: ${{ github.token }}
        artifacts: 'tsfranki-linux.tar.gz,tsfranki-source.tar.gz,tsfranki-*.tgz,tsfranki.spdx.json,wiki-agent-browser.spdx.json,third-party-licenses.json,release-manifest.json,SHA256SUMS,tsfranki-release.intoto.jsonl'

    - name: Notify Telegram Channel
      uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        format: markdown
        disable_web_page_preview: true
        message: |
          tsFranki *${{ github.ref_name }}* has been released!
          See [release notes](https://github.com/PhilosophiMoonbeam/wiki/releases) for details.

    - name: Notify Discord Channel
      uses: sebastianpopp/discord-action@4f2d5417bc61a79593304a62e71cd32427c17790 # v2.0
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        message: tsFranki ${{ github.ref_name }} has been released! See https://github.com/PhilosophiMoonbeam/wiki/releases for details.
