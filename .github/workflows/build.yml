    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4


    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download Linux Build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: drop
        path: drop

    - name: Extract Build
      run: |
        mkdir -p build
        tar -xzf "$GITHUB_WORKSPACE/drop/tsepistle-linux.tar.gz" -C "$GITHUB_WORKSPACE/build" --exclude=node_modules

    - name: Build and Push ARM64 Candidate
      id: build-app-arm64
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build-arm/Dockerfile
        build-args: |
          WIKI_BUILD_DATE=${{ env.WIKI_BUILD_DATE }}
          WIKI_BUILD_REVISION=${{ env.WIKI_BUILD_REVISION }}
          WIKI_PRODUCT_DESCRIPTION=${{ env.WIKI_PRODUCT_DESCRIPTION }}
          WIKI_PRODUCT_NAME=${{ env.WIKI_PRODUCT_NAME }}
          WIKI_PRODUCT_VERSION=${{ env.WIKI_PRODUCT_VERSION }}
          WIKI_SOURCE_REPOSITORY=${{ env.WIKI_SOURCE_REPOSITORY }}
          WIKI_UPSTREAM_BASE=${{ env.WIKI_UPSTREAM_BASE }}
        platforms: linux/arm64
        provenance: mode=max
        sbom: true
        push: true
        tags: ${{ env.IMAGE_REPOSITORY }}:candidate-arm64-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Build and Push ARM64 Agent Browser Candidate
      id: build-agent-browser-arm64
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build/Dockerfile.agent-browser
        platforms: linux/arm64
        provenance: mode=max
        sbom: true
        push: true
        tags: ${{ env.IMAGE_REPOSITORY }}-agent-browser:candidate-arm64-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Capture ARM64 Image Descriptors
      shell: bash
      env:
        APP_ARM64_DIGEST: ${{ steps.build-app-arm64.outputs.digest }}
        AGENT_BROWSER_ARM64_DIGEST: ${{ steps.build-agent-browser-arm64.outputs.digest }}
      run: |
        validate_arm64_descriptor() {
          local descriptor="$1"
          local manifest_file="$2"
          docker buildx imagetools inspect "$descriptor" --raw > "$manifest_file"
          jq --exit-status '
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length) == 1
            and all(.manifests[];
              (.platform.os == "linux" and .platform.architecture == "arm64")
              or (.platform.os == "unknown" and .platform.architecture == "unknown")
            )
          ' "$manifest_file"
        }

        [[ "$APP_ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
        [[ "$AGENT_BROWSER_ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
        app_descriptor="$IMAGE_REPOSITORY@$APP_ARM64_DIGEST"
        agent_browser_descriptor="$IMAGE_REPOSITORY-agent-browser@$AGENT_BROWSER_ARM64_DIGEST"
        validate_arm64_descriptor "$app_descriptor" app-arm64-manifest.json
        validate_arm64_descriptor "$agent_browser_descriptor" agent-browser-arm64-manifest.json
        printf '%s\n' "$app_descriptor" > image-arm64-descriptor.txt
        printf '%s\n' "$agent_browser_descriptor" > agent-browser-arm64-descriptor.txt

    - name: Upload ARM64 Image Descriptors
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: arm64-image-descriptors
        path: |
          image-arm64-descriptor.txt
          agent-browser-arm64-descriptor.txt
        if-no-files-found: error
        retention-days: 30

  publish-canary:
    name: Promote Synchronized Canary Images
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-amd64, arm]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set Build Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download AMD64 Image Descriptors
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: amd64-image-descriptors
        path: image-descriptors

    - name: Download ARM64 Image Descriptors
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: arm64-image-descriptors
        path: image-descriptors

    - name: Assemble Immutable Canary Promotion Record
      shell: bash
      run: |
        read_descriptor() {
          local descriptor_file="$1"
          local repository="$2"
          local descriptor
          local digest
          descriptor="$(cat "$descriptor_file")"
          digest="${descriptor#"$repository"@}"
          test "$descriptor" = "$repository@$digest"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$descriptor" --raw > /dev/null
          printf '%s\n' "$descriptor"
        }

        freshness_fence() {
          local remote_main
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "Refusing stale canary promotion: run $GITHUB_SHA is not current main $remote_main." >&2
            exit 1
          fi
        }

        image_amd64="$(read_descriptor image-descriptors/image-amd64-descriptor.txt "$IMAGE_REPOSITORY")"
        image_arm64="$(read_descriptor image-descriptors/image-arm64-descriptor.txt "$IMAGE_REPOSITORY")"
        agent_browser_repository="$IMAGE_REPOSITORY-agent-browser"
        agent_browser_amd64="$(read_descriptor image-descriptors/agent-browser-amd64-descriptor.txt "$agent_browser_repository")"
        agent_browser_arm64="$(read_descriptor image-descriptors/agent-browser-arm64-descriptor.txt "$agent_browser_repository")"
        promotion_repository="$IMAGE_REPOSITORY-canary-promotion"
        candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
        jq -n \
          --arg main_sha "$GITHUB_SHA" \
          --arg image_amd64 "$image_amd64" \
          --arg image_arm64 "$image_arm64" \
          --arg agent_browser_amd64 "$agent_browser_amd64" \
          --arg agent_browser_arm64 "$agent_browser_arm64" '{
            schemaVersion: 1,
            mainSha: $main_sha,
            images: {
              application: {amd64: $image_amd64, arm64: $image_arm64},
              agentBrowser: {amd64: $agent_browser_amd64, arm64: $agent_browser_arm64}
            }
          }' > canary-promotion.json

        immutable_record="$promotion_repository:$GITHUB_SHA"
        publish_immutable_record=false
        if docker buildx imagetools inspect "$immutable_record" --raw > canary-promotion-manifest.json 2> canary-promotion-inspect-error.txt; then
          record_descriptor="$immutable_record"
        else
          inspect_error="$(cat canary-promotion-inspect-error.txt)"
          if [[ ! "$inspect_error" =~ ([Nn]ot[[:space:]][Ff]ound|manifest[[:space:]]unknown|404) ]]; then
            printf '%s\n' "$inspect_error" >&2
            exit 1
          fi

          docker buildx build \
            --file dev/build/Dockerfile.canary-promotion \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --push \
            --tag "$promotion_repository:$candidate_tag" \
            --annotation "manifest:io.tsepistle.canary-promotion.schema-version=1" \
            --annotation "manifest:io.tsepistle.canary-promotion.main-sha=$GITHUB_SHA" \
            --annotation "manifest:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "manifest:io.tsepistle.canary-promotion.application-amd64=$image_amd64" \
            --annotation "manifest:io.tsepistle.canary-promotion.application-arm64=$image_arm64" \
            --annotation "manifest:io.tsepistle.canary-promotion.agent-browser-amd64=$agent_browser_amd64" \
            --annotation "manifest:io.tsepistle.canary-promotion.agent-browser-arm64=$agent_browser_arm64" \
            --metadata-file canary-promotion-metadata.json \
            .
          record_digest="$(jq --exit-status --raw-output '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' canary-promotion-metadata.json)"
          record_descriptor="$promotion_repository@$record_digest"
          docker buildx imagetools inspect "$record_descriptor" --raw > canary-promotion-manifest.json
          publish_immutable_record=true
        fi

        jq --exit-status \
          --arg main_sha "$GITHUB_SHA" \
          --arg image_amd64 "$image_amd64" \
          --arg image_arm64 "$image_arm64" \
          --arg agent_browser_amd64 "$agent_browser_amd64" \
          --arg agent_browser_arm64 "$agent_browser_arm64" '
            (.annotations["io.tsepistle.canary-promotion.schema-version"] == "1")
            and (.annotations["io.tsepistle.canary-promotion.main-sha"] == $main_sha)
            and (.annotations["org.opencontainers.image.revision"] == $main_sha)
            and (.annotations["io.tsepistle.canary-promotion.application-amd64"] == $image_amd64)
            and (.annotations["io.tsepistle.canary-promotion.application-arm64"] == $image_arm64)
            and (.annotations["io.tsepistle.canary-promotion.agent-browser-amd64"] == $agent_browser_amd64)
            and (.annotations["io.tsepistle.canary-promotion.agent-browser-arm64"] == $agent_browser_arm64)
          ' canary-promotion-manifest.json

        freshness_fence
        if [ "$publish_immutable_record" = true ]; then
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$immutable_record" \
            "$record_descriptor"
        fi
        record_descriptor="$immutable_record"

        printf '%s\n' "$image_amd64" > canary-image-amd64.txt
        printf '%s\n' "$image_arm64" > canary-image-arm64.txt
        printf '%s\n' "$agent_browser_amd64" > canary-agent-browser-amd64.txt
        printf '%s\n' "$agent_browser_arm64" > canary-agent-browser-arm64.txt
        printf '%s\n' "$record_descriptor" > canary-promotion-record.txt

    - name: Update Non-authoritative Convenience Canary Tags
      shell: bash
      run: |
        image_amd64="$(cat canary-image-amd64.txt)"
        image_arm64="$(cat canary-image-arm64.txt)"
        agent_browser_amd64="$(cat canary-agent-browser-amd64.txt)"
        agent_browser_arm64="$(cat canary-agent-browser-arm64.txt)"
        agent_browser_repository="$IMAGE_REPOSITORY-agent-browser"
        docker buildx imagetools create \
          --prefer-index=false \
          --tag "$IMAGE_REPOSITORY:canary" \
          --tag "$IMAGE_REPOSITORY:canary-$REL_VERSION_STRICT" \
          "$image_amd64"
        docker buildx imagetools create \
          --prefer-index=false \
          --tag "$IMAGE_REPOSITORY:canary-arm64-$REL_VERSION_STRICT" \
          "$image_arm64"
        docker buildx imagetools create \
          --prefer-index=false \
          --tag "$agent_browser_repository:canary" \
          --tag "$agent_browser_repository:canary-$REL_VERSION_STRICT" \
          "$agent_browser_amd64"
        docker buildx imagetools create \
          --prefer-index=false \
          --tag "$agent_browser_repository:canary-arm64-$REL_VERSION_STRICT" \
          "$agent_browser_arm64"

    - name: Freshness Fence and Commit Authoritative Canary Set
      shell: bash
      run: |
        promotion_repository="$IMAGE_REPOSITORY-canary-promotion"
        record_descriptor="$(cat canary-promotion-record.txt)"
        remote_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
        if [ "$remote_main" != "$GITHUB_SHA" ]; then
          echo "Refusing stale canary promotion: run $GITHUB_SHA is not current main $remote_main." >&2
          exit 1
        fi
        docker buildx imagetools create \
          --prefer-index=false \
          --tag "$promotion_repository:canary-set" \
          "$record_descriptor"

  beta:
    name: Publish Preview Images
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-amd64, arm]
    permissions:
      packages: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set Build Metadata
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4


    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download AMD64 Image Descriptors
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: amd64-image-descriptors
        path: image-descriptors

    - name: Download ARM64 Image Descriptors
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: arm64-image-descriptors
        path: image-descriptors

    - name: Enforce Threat Model Release State
      run: bun server/scripts/check-threat-model.ts --release

    - name: Verify Descriptors and Push Preview Manifests
      shell: bash
      run: |
        read_descriptor() {
          local descriptor_file="$1"
          local repository="$2"
          local descriptor
          local digest
          descriptor="$(cat "$descriptor_file")"
          digest="${descriptor#"$repository"@}"
          test "$descriptor" = "$repository@$digest"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$descriptor" --raw > /dev/null
          printf '%s\n' "$descriptor"
        }

        image_amd64="$(read_descriptor image-descriptors/image-amd64-descriptor.txt "$IMAGE_REPOSITORY")"
        image_arm64="$(read_descriptor image-descriptors/image-arm64-descriptor.txt "$IMAGE_REPOSITORY")"
        agent_browser_repository="$IMAGE_REPOSITORY-agent-browser"
        agent_browser_amd64="$(read_descriptor image-descriptors/agent-browser-amd64-descriptor.txt "$agent_browser_repository")"
        agent_browser_arm64="$(read_descriptor image-descriptors/agent-browser-arm64-descriptor.txt "$agent_browser_repository")"

        docker buildx imagetools create \
          --tag "$IMAGE_REPOSITORY:preview-$REL_VERSION_STRICT" \
          "$image_amd64" \
          "$image_arm64"
        docker buildx imagetools create \
          --tag "$agent_browser_repository:preview-$REL_VERSION_STRICT" \
          "$agent_browser_amd64" \
          "$agent_browser_arm64"

    - name: Upload Release Image Descriptors
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: release-image-descriptors
        path: image-descriptors
        if-no-files-found: error
        retention-days: 30

  release:
    name: Publish Release Images
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: prod
    needs: [beta, reproducibility]
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set Build Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Validate Release Tag
      run: test "$GITHUB_REF_NAME" = "v$WIKI_PRODUCT_VERSION"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4


    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download Approved Release Image Descriptors
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: release-image-descriptors
        path: image-descriptors

    - name: Enforce Threat Model Release State
      run: bun server/scripts/check-threat-model.ts --release

    - name: Verify Descriptors and Push Release Manifests
      shell: bash
      run: |
        read_descriptor() {
          local descriptor_file="$1"
          local repository="$2"
          local descriptor
          local digest
          descriptor="$(cat "$descriptor_file")"
          digest="${descriptor#"$repository"@}"
          test "$descriptor" = "$repository@$digest"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$descriptor" --raw > /dev/null
          printf '%s\n' "$descriptor"
        }

        image_amd64="$(read_descriptor image-descriptors/image-amd64-descriptor.txt "$IMAGE_REPOSITORY")"
        image_arm64="$(read_descriptor image-descriptors/image-arm64-descriptor.txt "$IMAGE_REPOSITORY")"
        agent_browser_image_repository="$IMAGE_REPOSITORY-agent-browser"
        agent_browser_amd64="$(read_descriptor image-descriptors/agent-browser-amd64-descriptor.txt "$agent_browser_image_repository")"
        agent_browser_arm64="$(read_descriptor image-descriptors/agent-browser-arm64-descriptor.txt "$agent_browser_image_repository")"

        docker buildx imagetools create \
          --metadata-file release-image-metadata.json \
          --tag "$IMAGE_REPOSITORY:$REL_VERSION_STRICT" \
          --tag "$IMAGE_REPOSITORY:preview" \
          "$image_amd64" \
          "$image_arm64"
        image_digest="$(jq --exit-status --raw-output '."containerimage.descriptor".digest' release-image-metadata.json)"
        [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        docker buildx imagetools inspect "$IMAGE_REPOSITORY@$image_digest" --raw > /dev/null
        echo "IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"

        docker buildx imagetools create \
          --metadata-file agent-browser-image-metadata.json \
          --tag "$agent_browser_image_repository:$REL_VERSION_STRICT" \
          --tag "$agent_browser_image_repository:preview" \
          "$agent_browser_amd64" \
          "$agent_browser_arm64"
        agent_browser_image_digest="$(jq --exit-status --raw-output '."containerimage.descriptor".digest' agent-browser-image-metadata.json)"
        [[ "$agent_browser_image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        docker buildx imagetools inspect "$agent_browser_image_repository@$agent_browser_image_digest" --raw > /dev/null
        echo "AGENT_BROWSER_IMAGE_REPOSITORY=$agent_browser_image_repository" >> "$GITHUB_ENV"
        echo "AGENT_BROWSER_IMAGE_DIGEST=$agent_browser_image_digest" >> "$GITHUB_ENV"

    - name: Download Linux Build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: drop
        path: drop


    - name: Download License Inventory
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: compliance
        path: compliance

    - name: Generate Release Image SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        image: ${{ env.IMAGE_REPOSITORY }}@${{ env.IMAGE_DIGEST }}
        format: spdx-json
        output-file: tsepistle.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Generate Agent Browser Image SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        image: ${{ env.AGENT_BROWSER_IMAGE_REPOSITORY }}@${{ env.AGENT_BROWSER_IMAGE_DIGEST }}
        format: spdx-json
        output-file: wiki-agent-browser.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Package Helm Chart
      shell: bash
      run: |
        test "$WIKI_PRODUCT_VERSION" = "$(helm show chart dev/helm | sed -n 's/^appVersion: *//p')"
        server/test/scripts/check-helm-lifecycle-contract.sh
        helm package --destination dist dev/helm

    - name: Stage Release Artifacts
      shell: bash
      run: |
        cp drop/tsepistle-linux.tar.gz .
        cp "dist/tsepistle-$REL_VERSION_STRICT.tgz" .
        cp compliance/third-party-licenses.json .

    - name: Create Corresponding Source Archive
      run: git archive --format=tar.gz --prefix="tsepistle-$REL_VERSION_STRICT/" --output=tsepistle-source.tar.gz "$WIKI_BUILD_REVISION"

    - name: Generate Release Manifest and Checksums
      run: |
        bun server/scripts/generate-release-manifest.ts \
          release-manifest.json \
          SHA256SUMS \
          tsepistle-linux.tar.gz \
          tsepistle-source.tar.gz \
          "tsepistle-$REL_VERSION_STRICT.tgz" \
          tsepistle.spdx.json \
          wiki-agent-browser.spdx.json \
          third-party-licenses.json
        sha256sum --check SHA256SUMS

    - name: Attest Release Artifacts
      id: attest-release
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-checksums: SHA256SUMS

    - name: Stage Offline Provenance Bundle
      run: cp "${{ steps.attest-release.outputs.bundle-path }}" tsepistle-release.intoto.jsonl

    - name: Attest Release Image Provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-name: ${{ env.IMAGE_REPOSITORY }}
        subject-digest: ${{ env.IMAGE_DIGEST }}
        push-to-registry: true

    - name: Attest Release Image SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-name: ${{ env.IMAGE_REPOSITORY }}
        subject-digest: ${{ env.IMAGE_DIGEST }}
        sbom-path: tsepistle.spdx.json
        push-to-registry: true

    - name: Attest Agent Browser Image Provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-name: ${{ env.IMAGE_REPOSITORY }}-agent-browser
        subject-digest: ${{ env.AGENT_BROWSER_IMAGE_DIGEST }}
        push-to-registry: true

    - name: Attest Agent Browser Image SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-name: ${{ env.IMAGE_REPOSITORY }}-agent-browser
        subject-digest: ${{ env.AGENT_BROWSER_IMAGE_DIGEST }}
        sbom-path: wiki-agent-browser.spdx.json
        push-to-registry: true

    - name: Generate Changelog
      id: changelog
      uses: Requarks/changelog-action@b78a3354a01f4a1affb484b9264b506a815c46b1 # v1
      with:
        token: ${{ github.token }}
        tag: ${{ github.ref_name }}
        writeToFile: false

    - name: Update GitHub Release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        allowUpdates: true
        draft: false
        makeLatest: true
        name: ${{ github.ref_name }}
        body: ${{ steps.changelog.outputs.changes }}
        token: ${{ github.token }}
        artifacts: 'tsepistle-linux.tar.gz,tsepistle-source.tar.gz,tsepistle-*.tgz,tsepistle.spdx.json,wiki-agent-browser.spdx.json,third-party-licenses.json,release-manifest.json,SHA256SUMS,tsepistle-release.intoto.jsonl'

    - name: Notify Telegram Channel
      uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        format: markdown
        disable_web_page_preview: true
        message: |
          tsEpistle *${{ github.ref_name }}* has been released!
          See [release notes](https://github.com/PhilosophiMoonbeam/wiki/releases) for details.

    - name: Notify Discord Channel
      uses: sebastianpopp/discord-action@4f2d5417bc61a79593304a62e71cd32427c17790 # v2.0
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        message: tsEpistle ${{ github.ref_name }} has been released! See https://github.com/PhilosophiMoonbeam/wiki/releases for details.
