name: Local CI + Publish

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0
  WIKI_HELM_PREVIOUS_IMAGE: ghcr.io/requarks/wiki:2.5.314@sha256:68f0d1848261ae76492ba358e30a96a76fed5d97a3fff381656082bf90f70d7e

jobs:
  pr-quality:
    name: PR Quality (Unprivileged)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0
    - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Install Dependencies
      run: bun install --frozen-lockfile
    - name: Run Static Contract
      run: bun run ci:static
    - name: Detect Helm Chart Changes
      id: chart-changes
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- dev/helm/; then
          changed=false
        else
          status=$?
          test "$status" -eq 1
          changed=true
        fi
        echo "changed=$changed" >> "$GITHUB_OUTPUT"
    - name: Install Pinned Helm
      if: steps.chart-changes.outputs.changed == 'true'
      shell: bash
      run: |
        curl --fail --silent --show-error --location --output "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.0.4-linux-amd64.tar.gz
        echo "29454bc351f4433e66c00f5d37841627cbbcc02e4c70a6d796529d355237671c  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
    - name: Validate Helm Source Contract
      if: steps.chart-changes.outputs.changed == 'true'
      run: server/test/scripts/check-helm-lifecycle-contract.sh
    - name: Run Unit Tests
      run: bun run test
    - name: Build Vite Assets
      run: bun run build

  quality:
    name: Quality
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Verify Local Toolchain
      run: |
        test "$(bun --version)" = "$BUN_VERSION"
        docker version

    - name: Install Dependencies
      run: bun install --frozen-lockfile

    - name: Run Static Contract
      run: bun run ci:static

    - name: Upload License Inventory
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: compliance
        path: third-party-licenses.json
        if-no-files-found: error
        retention-days: 30



    - name: Run Bun Tests
      run: bun run test

    - name: Build Vite Assets
      run: bun run build


  agent-postgres:
    name: Agent Ledger (PostgreSQL ${{ matrix.pgversion }})
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    timeout-minutes: 15
    needs: [quality]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - pgversion: 16
          postgresImage: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        - pgversion: 17
          postgresImage: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
    services:
      postgres:
        image: ${{ matrix.postgresImage }}
        env:
          POSTGRES_DB: wiki_agents_test
          POSTGRES_PASSWORD: test
          POSTGRES_USER: wiki
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U wiki -d wiki_agents_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - run: bun install --frozen-lockfile
    - name: Exercise Agent Migration and Rollback
      env:
        WIKI_TEST_POSTGRES_DATABASE: wiki_agents_test
        WIKI_TEST_POSTGRES_HOST: 127.0.0.1
        WIKI_TEST_POSTGRES_PASSWORD: test
        WIKI_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        WIKI_TEST_POSTGRES_USER: wiki
      run: bun test server/test/db/agents-migration.postgres.integration.test.ts

  private-pages-postgres:
    name: Private Pages Migration (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
        env:
          POSTGRES_DB: wiki_private_pages_test
          POSTGRES_PASSWORD: test
          POSTGRES_USER: wiki
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U wiki -d wiki_private_pages_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - run: bun install --frozen-lockfile
    - name: Exercise Private Pages Migration
      env:
        WIKI_TEST_POSTGRES_DATABASE: wiki_private_pages_test
        WIKI_TEST_POSTGRES_HOST: 127.0.0.1
        WIKI_TEST_POSTGRES_PASSWORD: test
        WIKI_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        WIKI_TEST_POSTGRES_USER: wiki
        WIKI_TEST_POSTGRES_REQUIRED: '1'
      run: bun test server/test/db/private-pages.postgres.integration.test.ts

  agent-browser-image:
    name: Agent Browser Multi-arch Image
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    timeout-minutes: 20
    needs: [quality]
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      with:
        image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm64
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
    - name: Build AMD64 and ARM64 Browser Worker
      run: |
        docker buildx build \
          --file dev/build/Dockerfile.agent-browser \
          --platform linux/amd64,linux/arm64 \
          --output type=oci,dest=/tmp/wiki-agent-browser.oci.tar \
          .
        test -s /tmp/wiki-agent-browser.oci.tar
  page-index-benchmark:
    name: Page Index Benchmark (PostgreSQL ${{ matrix.pgversion }})
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    timeout-minutes: 15
    needs: [quality]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - pgversion: 15
          postgresImage: postgres:15-alpine@sha256:4006528dcbdd9be8c1aaa50389caea4e93c46d6f54c3533bcd3253725e526e23
        - pgversion: 16
          postgresImage: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        - pgversion: 17
          postgresImage: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
        - pgversion: 18
          postgresImage: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Install Dependencies
      run: bun install --frozen-lockfile
    - name: Measure Bounded Page Index
      env:
        POSTGRES_TEST_IMAGE: ${{ matrix.postgresImage }}
        PAGE_INDEX_BENCHMARK_FILE: page-index-benchmark-postgres-${{ matrix.pgversion }}.json
      run: bun run benchmark:page-index
    - name: Upload Page Index Metrics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: page-index-benchmark-postgres-${{ matrix.pgversion }}
        path: page-index-benchmark-postgres-${{ matrix.pgversion }}.json
        if-no-files-found: error
        retention-days: 30

  build:
    name: Build Test Image and Linux Bundle
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    timeout-minutes: 45
    needs: [quality]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set Build Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Login to GitHub Container Registry
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Test Image
      id: build-candidate
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build/Dockerfile
        build-args: |
          WIKI_BUILD_DATE=${{ env.WIKI_BUILD_DATE }}
          WIKI_BUILD_REVISION=${{ env.WIKI_BUILD_REVISION }}
          WIKI_PRODUCT_DESCRIPTION=${{ env.WIKI_PRODUCT_DESCRIPTION }}
          WIKI_PRODUCT_NAME=${{ env.WIKI_PRODUCT_NAME }}
          WIKI_PRODUCT_VERSION=${{ env.WIKI_PRODUCT_VERSION }}
          WIKI_SOURCE_REPOSITORY=${{ env.WIKI_SOURCE_REPOSITORY }}
          WIKI_UPSTREAM_BASE=${{ env.WIKI_UPSTREAM_BASE }}
        platforms: linux/amd64
        load: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
        provenance: false
        push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        sbom: false
        tags: ${{ env.IMAGE_REPOSITORY }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Pull Exact Registry Candidate
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      run: |
        docker pull "$IMAGE_REPOSITORY@${{ steps.build-candidate.outputs.digest }}"
        docker tag "$IMAGE_REPOSITORY@${{ steps.build-candidate.outputs.digest }}" "tsepistle:test-$WIKI_BUILD_REVISION"
    - name: Tag Local Candidate
      if: github.event_name != 'push' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
      run: docker tag "$IMAGE_REPOSITORY:candidate-${{ github.run_id }}-${{ github.run_attempt }}" "tsepistle:test-$WIKI_BUILD_REVISION"

    - name: Export Tested AMD64 Candidate
      shell: bash
      env:
        PUBLISH_CANDIDATE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        TESTED_AMD64_DIGEST: ${{ steps.build-candidate.outputs.digest }}
      run: |
        candidate="tsepistle:test-$WIKI_BUILD_REVISION"
        if [ "$PUBLISH_CANDIDATE" = 'true' ]; then
          [[ "$TESTED_AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$TESTED_AMD64_DIGEST" > tested-amd64-digest.txt
        fi
        test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$candidate")" = 'linux/amd64'
        test "$(docker image inspect --format '{{index .Config.Labels "io.tsepistle.image.architecture"}}' "$candidate")" = 'amd64'
        docker image inspect --format '{{.Id}}' "$candidate" > tested-amd64-image-id.txt
        docker save "$candidate" | gzip -1 -n > tsepistle-test-image.tar.gz

    - name: Create Reproducible Linux Bundle
      run: dev/build/create-linux-bundle.sh "tsepistle:test-$WIKI_BUILD_REVISION" tsepistle-linux.tar.gz

    - name: Upload Linux Build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: drop
        path: tsepistle-linux.tar.gz
        if-no-files-found: error

    - name: Upload Test Image
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: test-image
        path: |
          tsepistle-test-image.tar.gz
          tested-amd64-image-id.txt
          tested-amd64-digest.txt
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

  reproducibility:
    name: Rebuild Linux Bundle Reproducibly
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Download Reference Linux Bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: drop
        path: reference

    - name: Set Build Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Independently Rebuild Test Image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build/Dockerfile
        build-args: |
          WIKI_BUILD_DATE=${{ env.WIKI_BUILD_DATE }}
          WIKI_BUILD_REVISION=${{ env.WIKI_BUILD_REVISION }}
          WIKI_PRODUCT_DESCRIPTION=${{ env.WIKI_PRODUCT_DESCRIPTION }}
          WIKI_PRODUCT_NAME=${{ env.WIKI_PRODUCT_NAME }}
          WIKI_PRODUCT_VERSION=${{ env.WIKI_PRODUCT_VERSION }}
          WIKI_SOURCE_REPOSITORY=${{ env.WIKI_SOURCE_REPOSITORY }}
          WIKI_UPSTREAM_BASE=${{ env.WIKI_UPSTREAM_BASE }}
        load: true
        provenance: false
        sbom: false
        tags: tsepistle:reproducibility-${{ env.WIKI_BUILD_REVISION }}

    - name: Compare Independent Linux Bundle
      shell: bash
      run: |
        dev/build/create-linux-bundle.sh \
          "tsepistle:reproducibility-$WIKI_BUILD_REVISION" \
          tsepistle-linux.tar.gz
        if ! cmp --silent reference/tsepistle-linux.tar.gz tsepistle-linux.tar.gz; then
          sha256sum reference/tsepistle-linux.tar.gz tsepistle-linux.tar.gz
          echo 'Independent Linux bundle does not reproduce the release candidate.' >&2
          exit 1
        fi
        sha256sum tsepistle-linux.tar.gz

  e2e:
    name: Playwright (PostgreSQL 18)
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    timeout-minutes: 45
    needs: [build]
    permissions:
      contents: read


    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Install Test Dependencies
      run: |
        bun install --frozen-lockfile
        bun --bun playwright install chromium firefox webkit

    - name: Download Test Image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-image
        path: test-image

    - name: Load Test Image
      run: gzip -dc test-image/tsepistle-test-image.tar.gz | docker load

    - name: Set Test Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Run Playwright Tests
      env:
        POSTGRES_TEST_IMAGE: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
        WIKI_TEST_IMAGE: tsepistle:test-${{ env.WIKI_BUILD_REVISION }}
        PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        POSTGRES_MAJOR: 18
        RUNTIME_PERFORMANCE_FILE: runtime-performance-postgres-18.json
      run: dev/e2e/ci-run.sh

    - name: Clean Playwright Services
      if: always()
      run: |
        docker rm --force wiki db >/dev/null 2>&1 || true
        docker volume rm wiki-data >/dev/null 2>&1 || true
        docker network rm wiki-e2e >/dev/null 2>&1 || true

    - name: Upload Playwright Failure Artifacts
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: playwright-failures-postgres-18
        path: test-results
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload Runtime Performance Metrics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: runtime-performance-postgres-18
        path: runtime-performance-postgres-18.json
        if-no-files-found: error
        retention-days: 30

  upgrade:
    name: Upgrade Wiki.js 2 (PostgreSQL ${{ matrix.pgversion }})
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    timeout-minutes: 30
    needs: [build]
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - pgversion: 15
          postgresImage: postgres:15-alpine@sha256:4006528dcbdd9be8c1aaa50389caea4e93c46d6f54c3533bcd3253725e526e23
        - pgversion: 16
          postgresImage: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        - pgversion: 17
          postgresImage: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
        - pgversion: 18
          postgresImage: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Download Test Image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-image
        path: test-image

    - name: Load Test Image
      run: gzip -dc test-image/tsepistle-test-image.tar.gz | docker load

    - name: Set Test Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Upgrade Supported Database
      env:
        POSTGRES_TEST_IMAGE: ${{ matrix.postgresImage }}
        WIKI_TEST_IMAGE: tsepistle:test-${{ env.WIKI_BUILD_REVISION }}
        MIGRATION_METRICS_FILE: migration-metrics-postgres-${{ matrix.pgversion }}.json
      run: dev/e2e/upgrade-smoke.sh

    - name: Upload Migration Metrics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: migration-metrics-postgres-${{ matrix.pgversion }}
        path: migration-metrics-postgres-${{ matrix.pgversion }}.json
        if-no-files-found: warn
        retention-days: 30

  multi-instance:
    name: Multi-instance Recovery (PostgreSQL ${{ matrix.pgversion }})
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    timeout-minutes: 20
    needs: [build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - pgversion: 15
          postgresImage: postgres:15-alpine@sha256:4006528dcbdd9be8c1aaa50389caea4e93c46d6f54c3533bcd3253725e526e23
        - pgversion: 18
          postgresImage: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44


    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Download Test Image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-image
        path: test-image

    - name: Load Test Image
      run: gzip -dc test-image/tsepistle-test-image.tar.gz | docker load

    - name: Set Test Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Exercise Instance Loss and Recovery
      env:
        POSTGRES_TEST_IMAGE: ${{ matrix.postgresImage }}
        WIKI_TEST_IMAGE: tsepistle:test-${{ env.WIKI_BUILD_REVISION }}
      run: dev/e2e/multi-instance-smoke.sh

  helm-lifecycle:
    name: Helm Install Upgrade Rollback
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    timeout-minutes: 25
    needs: [build]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Download Test Image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-image
        path: test-image

    - name: Load Test Image
      run: gzip -dc test-image/tsepistle-test-image.tar.gz | docker load

    - name: Set Test Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Install Pinned Kubernetes Tools
      shell: bash
      run: |
        tools_dir="$RUNNER_TEMP/kubernetes-tools"
        mkdir -p "$tools_dir"
        curl --fail --silent --show-error --location --output "$tools_dir/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
        echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  $tools_dir/kind" | sha256sum --check
        chmod 0755 "$tools_dir/kind"
        curl --fail --silent --show-error --location --output "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.0.4-linux-amd64.tar.gz
        echo "29454bc351f4433e66c00f5d37841627cbbcc02e4c70a6d796529d355237671c  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
        install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" "$tools_dir/helm"
        curl --fail --silent --show-error --location --output "$tools_dir/kubectl" https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
        echo "629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7  $tools_dir/kubectl" | sha256sum --check
        chmod 0755 "$tools_dir/kubectl"
        echo "$tools_dir" >> "$GITHUB_PATH"

    - name: Resolve Supported Previous Helm Release
      run: docker pull "$WIKI_HELM_PREVIOUS_IMAGE"

    - name: Create Lifecycle Cluster
      run: |
        kind delete cluster --name wiki-lifecycle || true
        kind create cluster --name wiki-lifecycle --image kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
        docker pull postgres@sha256:a2c20749c564b4eb73a77bfda626f8a3cde1bbfae020fb97c616a00cdc1a2181
        docker tag postgres@sha256:a2c20749c564b4eb73a77bfda626f8a3cde1bbfae020fb97c616a00cdc1a2181 wiki-postgres-test:15
        kind load docker-image --name wiki-lifecycle \
          "tsepistle:test-${WIKI_BUILD_REVISION}" \
          wiki-postgres-test:15

    - name: Exercise Helm Lifecycle
      env:
        WIKI_TEST_IMAGE_REPOSITORY: tsepistle
        WIKI_TEST_IMAGE_TAG: test-${{ env.WIKI_BUILD_REVISION }}
        WIKI_TEST_PREVIOUS_IMAGE: ${{ env.WIKI_HELM_PREVIOUS_IMAGE }}
        POSTGRES_TEST_IMAGE_REPOSITORY: wiki-postgres-test
        POSTGRES_TEST_IMAGE_TAG: '15'
      run: dev/e2e/helm-lifecycle-smoke.sh

    - name: Delete Lifecycle Cluster
      if: always()
      run: kind delete cluster --name wiki-lifecycle


  publish-amd64:
    name: Publish AMD64 Images
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, e2e, upgrade, multi-instance, helm-lifecycle, page-index-benchmark, agent-postgres, private-pages-postgres, agent-browser-image]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set Build Metadata
      shell: bash
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"

    - name: Validate Release Tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: test "$GITHUB_REF_NAME" = "v$WIKI_PRODUCT_VERSION"

    - name: Verify Published Source Revision
      run: curl --fail --silent --show-error --location --output /dev/null "$WIKI_SOURCE_REPOSITORY/tree/$WIKI_BUILD_REVISION"


    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4


    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download Tested AMD64 Candidate
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: test-image
        path: test-image

    - name: Validate Tested AMD64 Candidate
      shell: bash
      run: |
        gzip -dc test-image/tsepistle-test-image.tar.gz | docker load
        candidate="tsepistle:test-$WIKI_BUILD_REVISION"
        expected_image_id="$(cat test-image/tested-amd64-image-id.txt)"
        expected_amd64_digest="$(cat test-image/tested-amd64-digest.txt)"
        [[ "$expected_amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        test "$(docker image inspect --format '{{.Id}}' "$candidate")" = "$expected_image_id"
        test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$candidate")" = 'linux/amd64'
        docker buildx imagetools inspect "$IMAGE_REPOSITORY@$expected_amd64_digest" --raw > tested-amd64-manifest.json
        test "$(jq --exit-status --raw-output '.config.digest' tested-amd64-manifest.json)" = "$expected_image_id"
        printf '%s@%s\n' "$IMAGE_REPOSITORY" "$expected_amd64_digest" > image-amd64-descriptor.txt

    - name: Build and Push AMD64 Agent Browser Candidate
      id: build-agent-browser-amd64
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build/Dockerfile.agent-browser
        platforms: linux/amd64
        provenance: mode=max
        sbom: true
        push: true
        tags: ${{ env.IMAGE_REPOSITORY }}-agent-browser:candidate-amd64-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Capture AMD64 Agent Browser Descriptor
      shell: bash
      env:
        AGENT_BROWSER_AMD64_DIGEST: ${{ steps.build-agent-browser-amd64.outputs.digest }}
      run: |
        [[ "$AGENT_BROWSER_AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
        repository="$IMAGE_REPOSITORY-agent-browser"
        descriptor="$repository@$AGENT_BROWSER_AMD64_DIGEST"
        docker buildx imagetools inspect "$descriptor" --raw > agent-browser-amd64-manifest.json
        jq --exit-status '
          ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1
          and all(.manifests[];
            (.platform.os == "linux" and .platform.architecture == "amd64")
            or (.platform.os == "unknown" and .platform.architecture == "unknown")
          )
        ' agent-browser-amd64-manifest.json
        printf '%s\n' "$descriptor" > agent-browser-amd64-descriptor.txt

    - name: Upload AMD64 Image Descriptors
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: amd64-image-descriptors
        path: |
          image-amd64-descriptor.txt
          agent-browser-amd64-descriptor.txt
        if-no-files-found: error
        retention-days: 30

  arm:
    name: ARM64 Cross-build
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [e2e, page-index-benchmark, agent-postgres, agent-browser-image]
