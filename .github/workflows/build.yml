name: Explicit CI + Publish
run-name: "${{ github.event_name == 'workflow_run' && 'Full release' || github.event_name == 'workflow_dispatch' && (inputs.publish_canary && 'Full canary' || 'Full qualification') || 'Fast checks' }} ${{ github.event.workflow_run.head_sha || github.sha }}"

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      publish_canary:
        description: Publish the verified canary set from main after qualification
        type: boolean
        required: false
        default: false
  workflow_run:
    workflows: [Release Request]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.3
  BUN_OPTIONS: --no-env-file

jobs:
  changes:
    name: Select Native Coverage
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      native_required: ${{ steps.risk.outputs.native_required }}
      chart_changed: ${{ steps.risk.outputs.chart_changed }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - id: risk
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.sha }}
      run: bun server/scripts/ci-change-risk.ts >> "$GITHUB_OUTPUT"

  fast:
    name: Fast Checks
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
    # The pinned upstream Playwright CLI retains its declared Node runtime.
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24.15.0
        package-manager-cache: false
    - name: Install Media Test Tools
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends ffmpeg
        ffmpeg -version
        ffprobe -version
    - name: Install Dependencies
      run: bun install --frozen-lockfile
    - name: Install Matching Offline Browser
      run: node "$(bun --no-env-file -p "require.resolve('@playwright/test/cli')")" install --with-deps --only-shell chromium
    - name: Detect Helm Chart Changes
      id: chart-changes
      run: echo "changed=${{ needs.changes.outputs.chart_changed }}" >> "$GITHUB_OUTPUT"
    - name: Install Pinned Helm
      if: steps.chart-changes.outputs.changed == 'true'
      shell: bash
      run: |
        curl --fail --silent --show-error --location --output "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.0.4-linux-amd64.tar.gz
        echo "29454bc351f4433e66c00f5d37841627cbbcc02e4c70a6d796529d355237671c  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
    - name: Validate Helm Source Contract
      if: steps.chart-changes.outputs.changed == 'true'
      run: server/test/scripts/check-helm-lifecycle-contract.sh
    - name: Install Pinned qpdf
      shell: bash
      run: |
        archive="$RUNNER_TEMP/qpdf-11.9.1-bin-linux-x86_64.zip"
        install_dir="$RUNNER_TEMP/qpdf-11.9.1"
        curl --fail --silent --show-error --location --output "$archive" https://github.com/qpdf/qpdf/releases/download/v11.9.1/qpdf-11.9.1-bin-linux-x86_64.zip
        printf '%s  %s\n' '64eb765a32f41a79d881cc41b867cc23916c3b444f80cc1de6c02ed9547db8e4' "$archive" | sha256sum --check
        mkdir -p "$install_dir"
        unzip -q "$archive" -d "$install_dir"
        version="$(env -i PATH="$install_dir/bin:/usr/bin:/bin" LANG=C.UTF-8 qpdf --version)"
        test "${version%%$'\n'*}" = 'qpdf version 11.9.1'
        echo "$install_dir/bin" >> "$GITHUB_PATH"
    - name: Run Complete Fast Contract
      run: bun run ci:fast

  pr-quality:
    name: PR Quality (Unprivileged)
    if: always() && !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')))
    needs: [changes, fast, native-postgres]
    runs-on: ubuntu-latest
    steps:
    - name: Require Fast and Risk-selected Native Success
      env:
        CHANGES_RESULT: ${{ needs.changes.result }}
        FAST_RESULT: ${{ needs.fast.result }}
        NATIVE_REQUIRED: ${{ needs.changes.outputs.native_required }}
        NATIVE_RESULT: ${{ needs.native-postgres.result }}
      run: |
        test "$CHANGES_RESULT" = success
        test "$FAST_RESULT" = success
        if [ "$NATIVE_REQUIRED" = false ]; then
          test "$NATIVE_RESULT" = skipped
        else
          test "$NATIVE_RESULT" = success
        fi

  development:
    name: Publish Development Image and Smoke
    if: >-
      always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' && needs.fast.result == 'success' && needs.pr-quality.result == 'success' &&
      ((needs.changes.outputs.native_required == 'false' && needs.native-postgres.result == 'skipped') ||
       (needs.changes.outputs.native_required != 'false' && needs.native-postgres.result == 'success'))
    needs: [changes, fast, native-postgres, pr-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
    # The pinned upstream Playwright CLI retains its declared Node runtime.
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24.15.0
        package-manager-cache: false
    - name: Install Smoke Dependencies
      run: |
        bun install --frozen-lockfile
        node "$(bun --no-env-file -p "require.resolve('@playwright/test/cli')")" install --with-deps chromium
    - name: Set Canonical Build Metadata
      run: bun server/scripts/export-build-environment.ts >> "$GITHUB_ENV"
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Stage Development Candidate (Not Canary or Release)
      id: candidate
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        file: dev/build/Dockerfile
        build-args: |
          WIKI_BUILD_DATE=${{ env.WIKI_BUILD_DATE }}
          WIKI_BUILD_REVISION=${{ env.WIKI_BUILD_REVISION }}
          WIKI_PRODUCT_DESCRIPTION=${{ env.WIKI_PRODUCT_DESCRIPTION }}
          WIKI_PRODUCT_NAME=${{ env.WIKI_PRODUCT_NAME }}
          WIKI_PRODUCT_VERSION=${{ env.WIKI_PRODUCT_VERSION }}
          WIKI_SOURCE_REPOSITORY=${{ env.WIKI_SOURCE_REPOSITORY }}
          WIKI_UPSTREAM_BASE=${{ env.WIKI_UPSTREAM_BASE }}
        platforms: linux/amd64
        provenance: false
        sbom: false
        push: true
        tags: ${{ env.IMAGE_REPOSITORY }}:development-candidate-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Smoke Exact Published Candidate in Owned Fixture
      env:
        WIKI_TEST_IMAGE: ${{ env.IMAGE_REPOSITORY }}@${{ steps.candidate.outputs.digest }}
        WIKI_TEST_NAMESPACE: tsepistle-ci-${{ github.run_id }}-${{ github.run_attempt }}-dev-smoke
        WIKI_SMOKE_ARTIFACTS: ${{ runner.temp }}/development-smoke
      run: bash dev/ci/development-smoke.sh
    - name: Record Smoked Development Image Identity
      env:
        DEVELOPMENT_DIGEST: ${{ steps.candidate.outputs.digest }}
      run: |
        [[ "$DEVELOPMENT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
        jq --null-input --arg image "$IMAGE_REPOSITORY@$DEVELOPMENT_DIGEST" \
          --arg digest "$DEVELOPMENT_DIGEST" --arg revision "$WIKI_BUILD_REVISION" \
          '{image:$image,digest:$digest,revision:$revision,qualification:"fast+risk-selected-native+chromium-smoke"}' \
          > development-image.json
    - name: Upload Development Image Identity
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: development-image
        path: development-image.json
        if-no-files-found: error
        retention-days: 30
    - name: Upload Development Smoke Results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: development-smoke
        path: ${{ runner.temp }}/development-smoke
        if-no-files-found: error
        retention-days: 14
    - name: Promote Only Smoked Development Digest
      env:
        DEVELOPMENT_DIGEST: ${{ steps.candidate.outputs.digest }}
      run: |
        [[ "$DEVELOPMENT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
        docker buildx imagetools create --prefer-index=false \
          --tag "$IMAGE_REPOSITORY:development-$WIKI_BUILD_REVISION" \
          --tag "$IMAGE_REPOSITORY:development" "$IMAGE_REPOSITORY@$DEVELOPMENT_DIGEST"
        printf 'Development only (not fully qualified canary/release): %s@%s\nSource: %s\n' \
          "$IMAGE_REPOSITORY" "$DEVELOPMENT_DIGEST" "$WIKI_BUILD_REVISION" >> "$GITHUB_STEP_SUMMARY"

  native-postgres:
    name: Native PostgreSQL Suite (PostgreSQL 18)
    needs: [changes]
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && needs.changes.outputs.native_required != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
        env:
          POSTGRES_DB: wiki_native_test
          POSTGRES_PASSWORD: test
          POSTGRES_USER: wiki
        ports:
          - 5432/tcp
        options: >-
          --memory 4g
          --memory-swap 4g
          --health-cmd "pg_isready -U wiki -d wiki_native_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Install Media Test Tools
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends ffmpeg
        ffmpeg -version
        ffprobe -version
    - run: bun install --frozen-lockfile
    - name: Install Pinned qpdf
      shell: bash
      run: |
        archive="$RUNNER_TEMP/qpdf-11.9.1-bin-linux-x86_64.zip"
        install_dir="$RUNNER_TEMP/qpdf-11.9.1"
        curl --fail --silent --show-error --location --output "$archive" https://github.com/qpdf/qpdf/releases/download/v11.9.1/qpdf-11.9.1-bin-linux-x86_64.zip
        printf '%s  %s\n' '64eb765a32f41a79d881cc41b867cc23916c3b444f80cc1de6c02ed9547db8e4' "$archive" | sha256sum --check
        mkdir -p "$install_dir"
        unzip -q "$archive" -d "$install_dir"
        version="$(env -i PATH="$install_dir/bin:/usr/bin:/bin" LANG=C.UTF-8 qpdf --version)"
        test "${version%%$'\n'*}" = 'qpdf version 11.9.1'
        echo "$install_dir/bin" >> "$GITHUB_PATH"
    - name: Build Vite Assets
      run: bun run build
    - name: Exercise Complete Native PostgreSQL Suite
      env:
        WIKI_TEST_POSTGRES_HOST: 127.0.0.1
        WIKI_TEST_POSTGRES_PASSWORD: test
        WIKI_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        WIKI_TEST_POSTGRES_USER: wiki
      run: bun run test:postgres

  full-controller:
    name: Trusted Full Qualification and Publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: trusted-ci-controller
    permissions:
      contents: read
    outputs:
      APP_REVISION: ${{ steps.relay.outputs.APP_REVISION }}
      APP_REF: ${{ steps.relay.outputs.APP_REF }}
      PRIVATE_RUN_ID: ${{ steps.relay.outputs.PRIVATE_RUN_ID }}
      PRIVATE_RUN_ATTEMPT: ${{ steps.relay.outputs.PRIVATE_RUN_ATTEMPT }}
      PRIVATE_CONTROLLER_REVISION: ${{ steps.relay.outputs.PRIVATE_CONTROLLER_REVISION }}
      REQUEST_ID: ${{ steps.relay.outputs.REQUEST_ID }}
      INTENT: ${{ steps.relay.outputs.INTENT }}
    steps:
    # This checkout is the credential-bearing workflow's immutable main commit, never tag source.
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Dispatch Once and Await Exact Private Application Run
      id: relay
      env:
        GH_TOKEN: ${{ secrets.CI_CONTROLLER_TOKEN }}
        PUBLISH_CANARY: ${{ inputs.publish_canary || false }}
      run: bun --no-env-file .github/scripts/controller-relay.mjs
    - name: Download Exact Private Release Candidate
      if: steps.relay.outputs.INTENT == 'release'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: official-release-candidate
        path: official-release-candidate
        github-token: ${{ secrets.CI_CONTROLLER_TOKEN }}
        repository: PhilosophiMoonbeam/tsEpistle-ci
        run-id: ${{ steps.relay.outputs.PRIVATE_RUN_ID }}
    - name: Verify Exact Private Release Handoff
      if: steps.relay.outputs.INTENT == 'release'
      env:
        APP_REVISION: ${{ steps.relay.outputs.APP_REVISION }}
        APP_REF: ${{ steps.relay.outputs.APP_REF }}
        PRIVATE_RUN_ID: ${{ steps.relay.outputs.PRIVATE_RUN_ID }}
        PRIVATE_RUN_ATTEMPT: ${{ steps.relay.outputs.PRIVATE_RUN_ATTEMPT }}
        PRIVATE_CONTROLLER_REVISION: ${{ steps.relay.outputs.PRIVATE_CONTROLLER_REVISION }}
        REQUEST_ID: ${{ steps.relay.outputs.REQUEST_ID }}
      run: |
        git -c credential.helper= -c core.hooksPath=/dev/null fetch --no-tags --no-write-fetch-head https://github.com/PhilosophiMoonbeam/tsEpistle.git "+refs/heads/main:refs/ci-release-main" "+$APP_REF:$APP_REF"
        test "$(git rev-parse "$APP_REF^{commit}")" = "$APP_REVISION"
        git merge-base --is-ancestor "$APP_REVISION" refs/ci-release-main
        bun server/scripts/check-release-candidate.ts verify official-release-candidate
    - name: Transfer Verified Candidate to Current Public Run
      if: steps.relay.outputs.INTENT == 'release'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: official-release-candidate
        path: official-release-candidate
        if-no-files-found: error
        retention-days: 30

  release-finish:
    name: Finish Official Release (Public Application Signer)
    needs: [full-controller]
    if: needs.full-controller.result == 'success' && startsWith(needs.full-controller.outputs.APP_REF, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      APP_REVISION: ${{ needs.full-controller.outputs.APP_REVISION }}
      APP_REF: ${{ needs.full-controller.outputs.APP_REF }}
      PRIVATE_RUN_ID: ${{ needs.full-controller.outputs.PRIVATE_RUN_ID }}
      PRIVATE_RUN_ATTEMPT: ${{ needs.full-controller.outputs.PRIVATE_RUN_ATTEMPT }}
      PRIVATE_CONTROLLER_REVISION: ${{ needs.full-controller.outputs.PRIVATE_CONTROLLER_REVISION }}
      REQUEST_ID: ${{ needs.full-controller.outputs.REQUEST_ID }}
    steps:
    - name: Checkout Trusted Main Publication Implementation
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Require Truthful Public Main Signer
      run: |
        test "$GITHUB_REPOSITORY" = PhilosophiMoonbeam/tsEpistle
        test "$GITHUB_REF" = refs/heads/main
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - name: Set up Bun
      uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Download Same-Run Official Release Candidate
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: official-release-candidate
        path: official-release-candidate
    - name: Revalidate Public Release Source
      run: |
        [[ "$APP_REVISION" =~ ^[0-9a-f]{40}$ ]]
        [[ "$APP_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
        git -c credential.helper= -c core.hooksPath=/dev/null fetch --no-tags --no-write-fetch-head https://github.com/PhilosophiMoonbeam/tsEpistle.git "+refs/heads/main:refs/release-finish/public-main" "+$APP_REF:$APP_REF"
        test "$(git rev-parse "$APP_REF^{commit}")" = "$APP_REVISION"
        git merge-base --is-ancestor "$APP_REVISION" refs/release-finish/public-main
    - name: Verify Exact Official Release Candidate
      run: bun server/scripts/check-release-candidate.ts verify official-release-candidate
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
    - name: Login to Application Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Revalidate Exact Multiarch Release Images
      run: |
        verify_image() {
          local repository="$1" digest="$2" prefix="$3"
          docker buildx imagetools inspect "$repository@$digest" --raw > "$RUNNER_TEMP/$prefix-index.json"
          test "$(docker buildx imagetools inspect "$repository@$digest" --format '{{.Manifest.Digest}}')" = "$digest"
          jq --exit-status '.manifests | length >= 2' "$RUNNER_TEMP/$prefix-index.json"
          for arch in amd64 arm64; do
            descriptor="$(cat "official-release-candidate/$prefix-$arch-descriptor.txt")"
            arch_digest="${descriptor#"$repository"@}"
            test "$descriptor" = "$repository@$arch_digest"
            [[ "$arch_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            jq --exit-status --arg arch "$arch" --arg digest "$arch_digest" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch and .digest == $digest)] | length == 1' "$RUNNER_TEMP/$prefix-index.json"
            docker buildx imagetools inspect "$descriptor" --raw > /dev/null
          done
          test "$(docker buildx imagetools inspect "$repository:$RELEASE_VERSION" --format '{{.Manifest.Digest}}')" = "$digest"
        }
        verify_image "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" image
        verify_image "$IMAGE_REPOSITORY-agent-browser" "$AGENT_BROWSER_IMAGE_DIGEST" agent-browser
    - name: Attest Release Artifacts
      id: attest-release
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        github-token: ${{ github.token }}
        subject-checksums: official-release-candidate/SHA256SUMS
    - name: Stage Offline Provenance Bundle
      env:
        BUNDLE_PATH: ${{ steps.attest-release.outputs.bundle-path }}
      run: cp "$BUNDLE_PATH" official-release-candidate/tsepistle-release.intoto.jsonl
    - name: Attest Release Image Provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        github-token: ${{ github.token }}
        subject-name: ${{ env.IMAGE_REPOSITORY }}
        subject-digest: ${{ env.IMAGE_DIGEST }}
        push-to-registry: true
    - name: Attest Release Image SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        github-token: ${{ github.token }}
        subject-name: ${{ env.IMAGE_REPOSITORY }}
        subject-digest: ${{ env.IMAGE_DIGEST }}
        sbom-path: official-release-candidate/tsepistle.spdx.json
        push-to-registry: true
    - name: Attest Agent Browser Image Provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        github-token: ${{ github.token }}
        subject-name: ${{ env.IMAGE_REPOSITORY }}-agent-browser
        subject-digest: ${{ env.AGENT_BROWSER_IMAGE_DIGEST }}
        push-to-registry: true
    - name: Attest Agent Browser Image SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        github-token: ${{ github.token }}
        subject-name: ${{ env.IMAGE_REPOSITORY }}-agent-browser
        subject-digest: ${{ env.AGENT_BROWSER_IMAGE_DIGEST }}
        sbom-path: official-release-candidate/wiki-agent-browser.spdx.json
        push-to-registry: true
    - name: Generate Changelog
      id: changelog
      uses: Requarks/changelog-action@b78a3354a01f4a1affb484b9264b506a815c46b1 # v1
      with:
        token: ${{ github.token }}
        tag: ${{ env.APP_REF_NAME }}
        writeToFile: false
    - name: Update GitHub Release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        owner: PhilosophiMoonbeam
        repo: tsEpistle
        tag: ${{ env.APP_REF_NAME }}
        commit: ${{ env.APP_REVISION }}
        allowUpdates: true
        draft: false
        makeLatest: true
        name: ${{ env.APP_REF_NAME }}
        body: ${{ steps.changelog.outputs.changes }}
        token: ${{ github.token }}
        artifactErrorsFailBuild: true
