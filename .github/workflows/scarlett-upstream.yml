name: Scarlett Upstream Intake

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare recorded Scarlett revision
    runs-on: [self-hosted, linux, x64, tsepistle-ci]
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Verify Local Bun
      run: bun server/scripts/check-dependency-policy.ts

    - name: Compare Scarlett Upstream
      run: >-
        bun server/scripts/check-scarlett-upstream.ts
        --fetch
        --check
        --output scarlett-intake-report.json

    - name: Upload Scarlett Intake Report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: scarlett-intake
        path: scarlett-intake-report.json
        if-no-files-found: error
        retention-days: 30
