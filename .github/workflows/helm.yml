name: Helm Chart CI

on:
  # Validate and package the fork-owned chart on main.
  push:
    branches: [ main ]
    paths: [ dev/helm/** ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Validate Chart
    runs-on: [self-hosted, linux, x64, tsfranki-ci]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Local Bun
        run: bun server/scripts/check-dependency-policy.ts

      - name: Install Helm
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.0.4-linux-amd64.tar.gz
          echo "29454bc351f4433e66c00f5d37841627cbbcc02e4c70a6d796529d355237671c  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"

      - name: Verify Chart Version
        shell: bash
        run: |
          package_version="$(bun -e "console.log(require('./package.json').version)")"
          chart_version="$(helm show chart dev/helm | sed -n 's/^appVersion: *//p')"
          test "$package_version" = "$chart_version"

      - name: Verify Chart Contract
        run: server/test/scripts/check-helm-lifecycle-contract.sh

      - name: Package Chart
        run: helm package --destination dist dev/helm

      - name: Upload Chart Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tsfranki-helm
          path: dist/*.tgz
          if-no-files-found: error
