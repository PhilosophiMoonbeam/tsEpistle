name: Helm Chart CI

on:
  # Validate and package the fork-owned chart on main.
  push:
    branches: [ main ]
    paths: [ dev/helm/** ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Validate Chart
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Chart Version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          chart_version="$(helm show chart dev/helm | sed -n 's/^appVersion: *//p')"
          test "$package_version" = "$chart_version"

      - name: Verify Database Secret Contract
        shell: bash
        run: |
          if helm template wiki dev/helm >/dev/null 2>&1; then
            echo "Chart unexpectedly rendered with the empty default database password" >&2
            exit 1
          fi
          helm template wiki dev/helm \
            --set postgresql.existingSecret=wiki-postgresql \
            >/dev/null

      - name: Lint and Package Chart
        run: |
          helm lint dev/helm --set postgresql.postgresqlPassword=ci-validation-only
          helm package --destination dist dev/helm

      - name: Upload Chart Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wiki-ts-preview-helm
          path: dist/*.tgz
          if-no-files-found: error
