key: giscus
title: Giscus
description: GitHub Discussions-backed comments for public repositories.
author: Giscus
logo: https://static.requarks.io/logo/giscus.svg
website: https://giscus.app
codeTemplate: true
isAvailable: true
props:
  repo:
    type: String
    title: Repository
    default: ''
    hint: 'Public repository in owner/name form with Discussions, the Giscus app and this wiki origin enabled.'
    order: 1
  repoId:
    type: String
    title: Repository ID
    default: ''
    hint: Repository identifier generated by giscus.app.
    order: 2
  category:
    type: String
    title: Discussion Category
    default: Announcements
    order: 3
  categoryId:
    type: String
    title: Category ID
    default: ''
    hint: Category identifier generated by giscus.app.
    order: 4
  theme:
    type: String
    title: Theme
    default: preferred_color_scheme
    enum:
      - 'preferred_color_scheme|Follow the reader'
      - 'light|Light'
      - 'dark|Dark'
      - 'transparent_dark|Transparent dark'
    order: 5
  reactionsEnabled:
    type: Boolean
    title: Reactions
    default: true
    order: 6
  lang:
    type: String
    title: Language
    default: en
    hint: Giscus interface language code. CSP must allow scripts and frames from https://giscus.app.
    order: 7
