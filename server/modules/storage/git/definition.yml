key: git
title: Git
description: Git is a version control system for tracking changes in computer files and coordinating work on those files among multiple people.
author: requarks.io
logo: https://static.requarks.io/logo/git-alt.svg
website: https://git-scm.com/
isAvailable: true
supportedModes:
  - sync
  - push
  - pull
defaultMode: sync
schedule: PT5M
props:
  authType:
    type: String
    default: 'ssh'
    title: Authentication Type
    hint: Use SSH for maximum security.
    enum:
      - 'basic'
      - 'ssh'
    order: 1
  repoUrl:
    type: String
    title: Repository URI
    hint: Git-compliant URI (e.g. git@github.com:org/repo.git for ssh, https://github.com/org/repo.git for basic)
    order: 2
  branch:
    type: String
    default: 'master'
    hint: The branch to use during pull / push
    order: 3
  sshPrivateKeyMode:
    type: String
    title: SSH Private Key Mode
    hint: SSH Authentication Only - The mode to use to load the private key. Fill in the corresponding field below.
    order: 11
    default: 'path'
    enum:
        - 'path'
        - 'contents'
  sshPrivateKeyPath:
    type: String
    title: A - SSH Private Key Path
    hint: SSH Authentication Only - Absolute path to the key. The key must NOT be passphrase-protected. Mode must be set to path to use this option.
    order: 12
  sshPrivateKeyContent:
    type: String
    title: B - SSH Private Key Contents
    hint: SSH Authentication Only - Paste the contents of the private key. The key must NOT be passphrase-protected. Mode must be set to contents to use this option.
    multiline: true
    sensitive: true
    order: 13
  sshKnownHosts:
    type: String
    title: Verified SSH host keys
    hint: Optional known_hosts entries obtained from the server administrator through a trusted channel. When supplied, only these entries are trusted. Otherwise, use the application's standard known_hosts files. Unknown or changed host keys are refused.
    default: ''
    multiline: true
    order: 13.5
  verifySSL:
    type: Boolean
    default: true
    title: Verify SSL Certificate
    hint: Some hosts requires SSL certificate checking to be disabled. Leave enabled for proper security.
    order: 14
  basicUsername:
    type: String
    title: Username
    hint: Basic Authentication Only
    order: 20
  basicPassword:
    type: String
    title: Password / PAT
    hint: Basic Authentication Only
    sensitive: true
    order: 21
  defaultEmail:
    type: String
    title: Default Author Email
    default: 'name@company.com'
    hint: 'Used as fallback in case the author of the change is not present.'
    order: 22
  defaultName:
    type: String
    title: Default Author Name
    default: 'John Smith'
    hint: 'Used as fallback in case the author of the change is not present.'
    order: 23
  localRepoPath:
    type: String
    title: Local Repository Path
    default: './data/repo'
    hint: 'Path where the local git repository will be created.'
    order: 30
  alwaysNamespace:
    type: Boolean
    title: Always Locale Namespace
    default: false
    hint: 'Non-Markdown exports only: put primary-language content into a locale subfolder. Markdown always retains canonical locale paths.'
    order: 40
  gitBinaryPath:
    type: String
    title: Git Binary Path
    default: ''
    hint: Optional - Absolute path to the Git binary, when not available in PATH. Leave empty to use the default PATH location (recommended).
    order: 50
  stripLeadingH1:
    type: Boolean
    title: Strip leading external document heading
    default: false
    hint: 'Ingestion only: remove a leading Markdown H1 or header-free AsciiDoc title from plain or legacy sources when body content remains. Canonical OKF and reserved concepts are never changed.'
    order: 60
  mapReadmeToHome:
    type: Boolean
    title: Import root README as home
    default: false
    hint: 'Ingestion only: map plain or legacy Markdown/AsciiDoc README at the repository or locale root to home. Nested README and OKF stay unchanged; ambiguous home sources are refused. Exports retain canonical paths.'
    order: 61
actions:
  - handler: syncUntracked
    label: Add Untracked Changes
    hint: Export public DB content to canonical local Git paths and commit missing files. The working copy must be settled first; pending uncommitted mutations are never overwritten by this action. Useful after enabling Git for existing content.
  - handler: sync
    label: Force Sync
    hint: Trigger an immediate sync operation regardless of the schedule. The configured direction is respected; pending working-copy mutations must be recovered first, and unseen remote history is never force-overwritten.
  - handler: importAll
    label: Import Everything
    hint: Will import all content currently in the local Git repository, regardless of the latest commit state. Useful for importing content from the remote repository created before git was enabled.
  - handler: purge
    label: Purge Local Repository
    hint: Reinitialize a clean working copy from the remote. Pending imports, uncommitted mutations, and unpublished commits must be recovered first; they are never discarded by this action. The remote is not modified.
