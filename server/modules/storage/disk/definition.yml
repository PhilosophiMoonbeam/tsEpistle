key: disk
title: Local File System
description: Local storage on disk or network shares.
author: requarks.io
logo: https://static.requarks.io/logo/local-fs.svg
website: https://wiki.js.org
isAvailable: true
supportedModes:
  - push
defaultMode: push
schedule: false
internalSchedule: P1D
props:
  path:
    type: String
    title: Path
    hint: Absolute path without a trailing slash (e.g. /home/wiki/backup, C:\wiki\backup)
    order: 1
  createDailyBackups:
    type: Boolean
    default: false
    title: Create Daily Backups
    hint: A tar.gz archive containing all content will be created daily in subfolder named _daily. Archives are kept for a month.
    order: 2
  stripLeadingH1:
    type: Boolean
    default: false
    title: Strip leading external document heading
    hint: 'Ingestion only: remove a leading Markdown H1 or header-free AsciiDoc title from plain or legacy sources when body content remains. Canonical OKF and reserved concepts are never changed.'
    order: 3
  mapReadmeToHome:
    type: Boolean
    default: false
    title: Import root README as home
    hint: 'Ingestion only: map plain or legacy Markdown/AsciiDoc README at the target or locale root to home. Nested README and OKF stay unchanged; ambiguous home sources are refused. Exports retain canonical paths.'
    order: 4
actions:
  - handler: dump
    label: Dump all content to disk
    hint: Output all content from the DB to the local disk. If you enabled this module after content was created or you temporarily disabled this module, you'll want to execute this action to add the missing files.
  - handler: backup
    label: Create Backup
    hint: Will create a manual backup archive at this point in time, in a subfolder named _manual, from the contents currently on disk.
  - handler: importAll
    label: Import Everything
    hint: Will import all content currently in the local disk folder.
