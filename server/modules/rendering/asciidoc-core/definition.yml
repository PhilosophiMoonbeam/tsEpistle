key: asciidocCore
title: Core
description: Basic Asciidoc Parser
author: dzruyk (Based on asciidoctor.js renderer)
input: asciidoc
output: html
icon: mdi-sitemap
enabledDefault: true
props:
  safeMode:
    type: String
    default: secure
    title: Safe Mode
    hint: Use secure mode for untrusted wiki content. Less restrictive modes permit server-side file reads.
    order: 1
    enum:
      - unsafe
      - safe
      - server
      - secure
