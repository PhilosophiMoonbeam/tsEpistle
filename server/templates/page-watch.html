<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Page notification</title>
</head>
<body style="margin:0;background:#f3f4f6;font-family:Arial,sans-serif;color:#1f2937">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
    <tr><td align="center">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fff;border-radius:8px;padding:32px">
        <tr><td>
          <img src="<%= logo %>" alt="<%- siteTitle %>" style="max-height:48px;max-width:180px">
          <h1 style="font-size:22px;margin:28px 0 16px">Page notification</h1>
          <p style="font-size:16px;line-height:1.5"><strong><%- actorName %></strong> <%- action %> <strong><%- pageTitle %></strong>.</p>
          <p style="margin:28px 0"><a href="<%- url %>" style="background:#1976d2;color:#fff;padding:12px 18px;border-radius:4px;text-decoration:none">Open page</a></p>
          <p style="font-size:12px;color:#6b7280"><%- copyright %></p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
