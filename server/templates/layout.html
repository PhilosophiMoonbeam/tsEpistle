<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title><%- siteTitle %></title>
</head>
<body style="margin:0;padding:0;background:#f4f3ef;color:#272b2e;font-family:'Trebuchet MS',Arial,sans-serif;overflow-wrap:anywhere;word-break:break-word">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0"><%- preheadertext %></div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f3ef">
    <tr><td align="center" style="padding:32px 16px">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px">
        <tr><td style="padding:0 8px 24px;font-family:Georgia,serif;font-size:22px;line-height:1.3">
          <% if (logo) { %><img src="<%- logo %>" alt="" height="36" style="max-width:120px;height:36px;vertical-align:middle;margin-right:12px;border:0"><% } %>
          <strong><%- siteTitle %></strong>
        </td></tr>
        <tr><td style="background:#ffffff;border-top:3px solid #a87530;border-radius:0 0 8px 8px;padding:32px 28px">
          <%= body %>
        </td></tr>
        <tr><td style="padding:22px 8px;color:#656a6d;font-size:12px;line-height:1.6"><%- copyright %></td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
