# ===============================================
# THEMES
# ===============================================

extend type Query {
  theming: ThemingQuery
}

extend type Mutation {
  theming: ThemingMutation
}

# -----------------------------------------------
# QUERIES
# -----------------------------------------------

type ThemingQuery {
  themes: [ThemingTheme] @auth(requires: ["manage:theme", "manage:system"])
  config: ThemingConfig @auth(requires: ["manage:theme", "manage:system"])
}

# -----------------------------------------------
# MUTATIONS
# -----------------------------------------------

type ThemingMutation {
  setConfig(
    theme: String!
    iconset: String!
    darkMode: Boolean!
    colors: ThemingColorsInput
    tocPosition: String
    gutterStyle: String
    gutterCustomCss: String
    injectCSS: String
    injectHead: String
    injectBody: String
  ): DefaultResponse @auth(requires: ["manage:theme", "manage:system"])
}

# -----------------------------------------------
# TYPES
# -----------------------------------------------

type ThemingConfig {
  theme: String!
  iconset: String!
  darkMode: Boolean!
  colors: ThemingColors!
  tocPosition: String
  gutterStyle: String!
  gutterCustomCss: String!
  injectCSS: String
  injectHead: String
  injectBody: String
}

type ThemingColors {
  light: ThemingModeColors!
  dark: ThemingModeColors!
}

type ThemingModeColors {
  background: String!
  surface: String!
  primary: String!
  secondary: String!
  accent: String!
  info: String!
  success: String!
  warning: String!
  error: String!
}

input ThemingColorsInput {
  light: ThemingModeColorsInput!
  dark: ThemingModeColorsInput!
}

input ThemingModeColorsInput {
  background: String!
  surface: String!
  primary: String!
  secondary: String!
  accent: String!
  info: String!
  success: String!
  warning: String!
  error: String!
}

type ThemingTheme {
  key: String
  title: String
  author: String
}
