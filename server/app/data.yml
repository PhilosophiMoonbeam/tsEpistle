# ---------------------------------
# DO NOT EDIT THIS FILE!
# This is reserved for system use!
# ---------------------------------
name: tsFranki
defaults:
  config:
    # File defaults
    port: 80
    db:
      type: postgres
      host: localhost
      port: 5432
      user: wikijs
      pass: wikijsrocks
      db: wiki
      ssl: false
      sslOptions:
        auto: true
    ssl:
      enabled: false
    pool:
      min: 1
    bindIP: 0.0.0.0
    logLevel: info
    logFormat: default
    offline: false
    ha: false
    bodyParserLimit: 5mb
    agents:
      enabled: false
      retention:
        temporarySessionHours: 24
        savedSessionDays: 90
        mcpContentDays: 7
        auditDays: 90
        maintenanceBatchSize: 100
      provider:
        enabled: false
        globalConcurrency: 4
        perUserConcurrency: 1
        pollingMilliseconds: 1000
      sse:
        maximumConnectionsPerUser: 3
      skills:
        enabled: false
        namespace: 'system/agent-skills'
      browser:
        enabled: false
      proposals:
        enabled: false
      writes:
        enabled: false
        create:
          enabled: false
        patch:
          enabled: false
        move:
          enabled: false
        restore:
          enabled: false
        delete:
          enabled: false
      mcp:
        enabled: false
    # DB defaults
    api:
      isEnabled: false
    metrics:
      isEnabled: false
    graphEndpoint: 'https://graph.requarks.io'
    lang:
      code: en
      autoUpdate: true
      namespaces: []
      namespacing: false
      rtl: false
    telemetry:
      clientId: ''
      isEnabled: false
    banner:
      isEnabled: false
      title: ''
      content: ''
    title: tsFranki
    company: ''
    contentLicense: ''
    footerOverride: ''
    logoUrl: /_assets/svg/icon-tsfranki.svg
    pageExtensions:
      - md
      - html
      - txt
    editors:
      available:
        - markdown
        - visual-markdown
        - ckeditor
        - asciidoc
        - code
    mail:
      host: ''
      secure: true
      verifySSL: true
    nav:
      mode: 'MIXED'
      expandParent: true
    theming:
      theme: 'default'
      iconset: 'md'
      darkMode: false
      colors:
        light:
          background: '#FFFFFF'
          surface: '#FFFFFF'
          primary: '#1867C0'
          secondary: '#48A9A6'
          accent: '#82B1FF'
          info: '#2196F3'
          success: '#4CAF50'
          warning: '#FB8C00'
          error: '#B00020'
        dark:
          background: '#121212'
          surface: '#212121'
          primary: '#2196F3'
          secondary: '#54B6B2'
          accent: '#448AFF'
          info: '#64B5F6'
          success: '#66BB6A'
          warning: '#FFA726'
          error: '#CF6679'
      tocPosition: 'left'
      gutterStyle: 'columns'
      gutterCustomCss: ''
    auth:
      autoLogin: false
      enforce2FA: false
      hideLocal: false
      loginBgUrl: ''
      audience: 'urn:wiki.js'
      tokenExpiration: '30m'
      tokenRenewal: '14d'
    editShortcuts:
      editFab: true
      editMenuBar: false
      editMenuBtn: true
      editMenuExternalBtn: true
      editMenuExternalName: 'GitHub'
      editMenuExternalIcon: 'mdi-github'
      editMenuExternalUrl: 'https://github.com/org/repo/blob/main/{filename}'
    features:
      featurePageRatings: true
      featurePageComments: true
      featurePageCollaboration: true
      featurePersonalWikis: true
    security:
      securityOpenRedirect: true
      securityIframe: true
      securityReferrerPolicy: true
      securityTrustProxy: false
      securitySRI: true
      securityHSTS: false
      securityHSTSDuration: 300
      securityCSP: false
      securityCSPDirectives: ''
    server:
      sslRedir: false
    uploads:
      maxFileSize: 5242880
      maxFiles: 10
      scanSVG: true
      forceDownload: true
    flags:
      ldapdebug: false
      sqllog: false
    # System defaults
    channel: STABLE
    setup: false
    dataPath: ./data
    cors:
      credentials: true
      maxAge: 600
      methods: 'GET,POST'
      origin: true
    search:
      maxHits: 100
    maintainerEmail: security@requarks.io
localeNamespaces:
  - admin
  - auth
  - common
jobs:
  durableJobs:
    onInit: true
    schedule: PT10S
    offlineSkip: false
    repeat: true
  purgeUploads:
    onInit: true
    schedule: PT15M
    offlineSkip: false
    repeat: true
  syncGraphLocales:
    onInit: true
    schedule: P1D
    offlineSkip: true
    repeat: true
  rebuildTree:
    onInit: true
    offlineSkip: false
    repeat: false
    immediate: true
    worker: true
groups:
  defaultPermissions:
    - 'read:pages'
    - 'read:assets'
    - 'read:comments'
    - 'write:comments'
  defaultPageRules:
    - id: default
      deny: false
      match: START
      roles:
        - 'read:pages'
        - 'read:assets'
        - 'read:comments'
        - 'write:comments'
      path: ''
      locales: []
reservedPaths:
  - login
  - logout
  - register
  - verify
  - favicons
  - fonts
  - img
  - js
  - svg
# ---------------------------------
