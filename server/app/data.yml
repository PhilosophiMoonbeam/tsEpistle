# ---------------------------------
# DO NOT EDIT THIS FILE!
# This is reserved for system use!
# ---------------------------------
name: tsFranki
defaults:
  config:
    # File defaults
    port: 80
    db:
      type: postgres
      host: localhost
      port: 5432
      user: wikijs
      pass: wikijsrocks
      db: wiki
      ssl: false
      sslOptions:
        auto: true
    ssl:
      enabled: false
    pool:
      min: 1
    bindIP: 0.0.0.0
    logLevel: info
    logFormat: default
    offline: false
    ha: false
    bodyParserLimit: 5mb
    agents:
      enabled: false
      retention:
        temporarySessionHours: 24
        savedSessionDays: 90
        mcpContentDays: 7
        auditDays: 90
        maintenanceBatchSize: 100
      provider:
        enabled: false
        globalConcurrency: 4
        perUserConcurrency: 1
        pollingMilliseconds: 1000
      orchestration:
        enabled: false
        maxConcurrentChildren: 3
        maxChildren: 6
        plannerTurns: 2
        childTurns: 4
        childToolCalls: 8
        plannerTimeoutMilliseconds: 30000
        childTimeoutMilliseconds: 120000
        plannerMaxOutputTokens: 1024
        childMaxOutputTokens: 2048
        maxAggregateChildTokens: 12000
        maxAggregateChildOutputCharacters: 96000
      goals:
        enabled: false
        maxContinuations: 3
        maxTokens: 48000
        maxToolCalls: 96
        maxDurationMilliseconds: 3600000
      sse:
        maximumConnectionsPerUser: 3
      skills:
        enabled: false
        namespace: 'system/agent-skills'
      browser:
        enabled: false
      proposals:
        enabled: false
      writes:
        enabled: false
        create:
          enabled: false
        patch:
          enabled: false
        move:
          enabled: false
        restore:
          enabled: false
        delete:
          enabled: false
      mcp:
        enabled: false
    # DB defaults
    api:
      isEnabled: false
    metrics:
      isEnabled: false
    graphEndpoint: 'https://graph.requarks.io'
    lang:
      code: en
      autoUpdate: true
      namespaces: []
      namespacing: false
      rtl: false
    telemetry:
      clientId: ''
      isEnabled: false
    banner:
      isEnabled: false
      title: ''
      content: ''
    title: tsFranki
    company: ''
    contentLicense: ''
    footerOverride: ''
    logoUrl: /_assets/svg/icon-tsfranki.svg
    pageExtensions:
      - md
      - html
      - txt
    editors:
      available:
        - markdown
        - visual-markdown
    mail:
      host: ''
      secure: true
      verifySSL: true
    nav:
      mode: 'MIXED'
      expandParent: true
    theming:
      theme: 'default'
      iconset: 'md'
      darkMode: false
      colors:
        light:
          background: '#F7F7F5'
          surface: '#F8F9FA'
          primary: '#F9A134'
          secondary: '#484C51'
          accent: '#818385'
          info: '#2F6F9F'
          success: '#347A55'
          warning: '#A85B00'
          error: '#B33A45'
        dark:
          background: '#181A1C'
          surface: '#24272A'
          primary: '#F9A134'
          secondary: '#A6A8AA'
          accent: '#B8BABC'
          info: '#73ADD3'
          success: '#72B38D'
          warning: '#E4A24B'
          error: '#D97A83'
      tocPosition: 'left'
    auth:
      autoLogin: false
      enforce2FA: false
      hideLocal: false
      loginBgUrl: ''
      audience: 'urn:wiki.js'
      tokenExpiration: '30m'
      tokenRenewal: '14d'
    editShortcuts:
      editFab: true
      editMenuBar: false
      editMenuBtn: true
      editMenuExternalBtn: true
      editMenuExternalName: 'GitHub'
      editMenuExternalIcon: 'mdi-github'
      editMenuExternalUrl: 'https://github.com/org/repo/blob/main/{filename}'
    features:
      featurePageRatings: true
      featurePageComments: true
      featurePageCollaboration: true
      featurePersonalWikis: true
    security:
      securityOpenRedirect: true
      securityIframe: true
      securityReferrerPolicy: true
      securityTrustProxy: false
      securitySRI: true
      securityHSTS: false
      securityHSTSDuration: 300
      securityCSP: false
      # Must be a valid single HTTP header value.
      securityCSPDirectives: ''
    server:
      sslRedir: false
    uploads:
      maxFileSize: 5242880
      maxFiles: 10
      scanSVG: true
      forceDownload: true
    flags:
      ldapdebug: false
      sqllog: false
    # System defaults
    channel: STABLE
    setup: false
    dataPath: ./data
    cors:
      credentials: true
      maxAge: 600
      methods: 'GET,POST'
      origin: true
    search:
      maxHits: 100
    maintainerEmail: security@requarks.io
localeNamespaces:
  - admin
  - auth
  - common
jobs:
  durableJobs:
    onInit: true
    schedule: PT10S
    offlineSkip: false
    repeat: true
  purgeUploads:
    onInit: true
    schedule: PT15M
    offlineSkip: false
    repeat: true
  syncGraphLocales:
    onInit: true
    schedule: P1D
    offlineSkip: true
    repeat: true
  rebuildTree:
    onInit: true
    offlineSkip: false
    repeat: false
    immediate: true
    worker: true
groups:
  defaultPermissions:
    - 'read:pages'
    - 'read:assets'
    - 'read:comments'
    - 'write:comments'
  defaultPageRules:
    - id: default
      deny: false
      match: START
      roles:
        - 'read:pages'
        - 'read:assets'
        - 'read:comments'
        - 'write:comments'
      path: ''
      locales: []
reservedPaths:
  - login
  - logout
  - register
  - verify
  - favicons
  - fonts
  - img
  - js
  - svg
# ---------------------------------
